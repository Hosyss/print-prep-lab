name: Admin Cloudflare read-only preflight

on:
  push:
    branches:
      - security/admin-control-plane-v2-20260830
    paths:
      - .github/workflows/admin-cloudflare-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: print-prep-lab-admin-cloudflare-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/security/admin-control-plane-v2-20260830'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}

    steps:
      - name: Check out the isolated Admin branch
        uses: actions/checkout@v4

      - name: Enforce branch and source isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/security/admin-control-plane-v2-20260830"
          test -f admin-control-plane/source/wrangler.toml
          test -f admin-control-plane/source/worker.js
          grep -Eq '^workers_dev[[:space:]]*=[[:space:]]*false$' admin-control-plane/source/wrangler.toml
          ! grep -Eq 'printpreplab\.pages\.dev/' admin-control-plane/source/wrangler.toml

      - name: Verify existing Cloudflare credentials are available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN (or CF_API_TOKEN) repository secret."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret or variable."
            exit 1
          fi
          if [[ -z "${ADMIN_EMAILS:-}" ]]; then
            echo "::error::Missing ADMIN_EMAILS repository secret."
            exit 1
          fi
          echo "Cloudflare credentials are present; values were not printed."

      - name: Run Admin security tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install isolated Admin dependencies
        working-directory: admin-control-plane/source
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run isolated Admin quality gate
        working-directory: admin-control-plane/source
        run: npm run check

      - name: Inspect Cloudflare resources without changing them
        shell: bash
        run: |
          set -euo pipefail

          cf_get_checked() {
            local label="$1"
            local path="$2"
            local outfile
            local status
            local detail
            outfile="$(mktemp)"
            status="$(curl --silent --show-error \
              --output "$outfile" \
              --write-out '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4${path}" || true)"

            if [[ "$status" != "200" ]]; then
              detail="$(jq -r '[.errors[]? | ((.code // "unknown")|tostring) + ": " + (.message // "unspecified Cloudflare error")] | join("; ")' "$outfile" 2>/dev/null || true)"
              if [[ -z "$detail" ]]; then
                detail="Cloudflare returned no parseable error message"
              fi
              echo "::error::${label} failed with HTTP ${status}: ${detail}" >&2
              rm -f "$outfile"
              return 1
            fi

            if ! jq -e '.success == true' "$outfile" >/dev/null 2>&1; then
              echo "::error::${label} returned HTTP 200 but success was not true." >&2
              rm -f "$outfile"
              return 1
            fi

            cat "$outfile"
            rm -f "$outfile"
          }

          failed=0
          d1="$(cf_get_checked "D1 database list" "/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100")" || failed=1
          workers="$(cf_get_checked "Workers scripts list" "/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts")" || failed=1
          access_apps="$(cf_get_checked "Access applications list" "/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/apps?per_page=100")" || failed=1
          access_org="$(cf_get_checked "Access organization read" "/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/organizations")" || failed=1
          workers_subdomain="$(cf_get_checked "Workers subdomain read" "/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")" || failed=1

          if [[ "$failed" -ne 0 ]]; then
            echo "::error::One or more read-only Cloudflare checks were denied. No Cloudflare mutations were attempted."
            exit 1
          fi

          d1_exists="$(jq -r '[.result[] | select(.name == "print-prep-lab-admin")] | length' <<<"$d1")"
          worker_exists="$(jq -r '[.result[] | select((.id // .name) == "print-prep-lab-admin")] | length' <<<"$workers")"
          access_count="$(jq '.result | length' <<<"$access_apps")"
          access_org_ready="$(jq -r 'if .result.auth_domain then 1 else 0 end' <<<"$access_org")"
          workers_subdomain_ready="$(jq -r 'if .result.subdomain then 1 else 0 end' <<<"$workers_subdomain")"

          echo "Dedicated D1 already exists: ${d1_exists}"
          echo "Dedicated Worker already exists: ${worker_exists}"
          echo "Access applications visible: ${access_count}"
          echo "Access organization ready: ${access_org_ready}"
          echo "Workers subdomain ready: ${workers_subdomain_ready}"

          {
            echo "## Admin Cloudflare read-only preflight"
            echo
            echo "- Exact branch: confirmed"
            echo "- Admin tests: passed"
            echo "- Dedicated D1 already exists: ${d1_exists}"
            echo "- Dedicated Worker already exists: ${worker_exists}"
            echo "- Access applications visible: ${access_count}"
            echo "- Access organization ready: ${access_org_ready}"
            echo "- Workers subdomain ready: ${workers_subdomain_ready}"
            echo "- Cloudflare mutations: none"
            echo "- Main / Production changes: none"
          } >> "$GITHUB_STEP_SUMMARY"
