name: Print Prep Lab low-value content remediation preview

on:
  push:
    branches:
      - content/adsense-low-value-20260917
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: print-prep-lab-low-value-content-preview
  cancel-in-progress: true

jobs:
  content-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: printpreplab
      PREVIEW_BRANCH: adsense-low-value-content-preview
      PREVIEW_ORIGIN: https://adsense-low-value-content-preview.printpreplab.pages.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Source quality gates
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run test:math
          node --experimental-strip-types --test tests/editorial-example-math.test.mjs
          npm test

      - name: Build reviewed layered Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          bash release-artifacts/v119.1/build-adsense-readiness.sh
          rm -rf /tmp/ppl-low-value
          mkdir -p /tmp/ppl-low-value
          unzip -q release-artifacts/v119.1/print-prep-lab-pages-adsense-readiness-final.zip -d /tmp/ppl-low-value
          test -s /tmp/ppl-low-value/_worker.js
          test -s /tmp/ppl-low-value/enterprise-suite.js
          test -s /tmp/ppl-low-value/home-v112.html
          test ! -e /tmp/ppl-low-value/print-readiness-v111.html
          grep -Fq 'Who is it for?' /tmp/ppl-low-value/home-v112.html

      - name: Install browser QA dependency
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0

      - name: Start isolated local Pages runtime
        shell: bash
        run: |
          set -euo pipefail
          (
            cd /tmp/ppl-low-value
            env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
              npx --yes wrangler@4.131.1 pages dev . \
              --ip 127.0.0.1 --port 4182 \
              --compatibility-date=2026-05-22 --compatibility-flags=nodejs_compat
          ) >/tmp/low-value-wrangler.log 2>&1 &
          echo $! >/tmp/low-value-wrangler.pid
          ready=0
          for attempt in $(seq 1 80); do
            if curl --silent --fail http://127.0.0.1:4182/ >/dev/null; then ready=1; break; fi
            sleep .5
          done
          test "$ready" = 1

      - name: Focused local runtime and content gates
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/qa-tool-content /tmp/qa-tool /tmp/qa-final /tmp/qa-crawl /tmp/qa-content /tmp/qa-visual
          mkdir -p /tmp/qa-tool-content /tmp/qa-tool /tmp/qa-final /tmp/qa-crawl /tmp/qa-content /tmp/qa-visual
          node tests/tool-content-runtime-qa.mjs http://127.0.0.1:4182 /tmp/qa-tool-content
          node tests/tool-input-qa.mjs http://127.0.0.1:4182 /tmp/qa-tool
          node tests/content-value-audit.mjs http://127.0.0.1:4182 /tmp/qa-content remediated
          node tests/final-site-audit.mjs http://127.0.0.1:4182 /tmp/ppl-low-value /tmp/qa-final
          node tests/final-route-crawl.mjs http://127.0.0.1:4182 /tmp/ppl-low-value /tmp/qa-crawl

      - name: Trust-page desktop/mobile visual review
        shell: bash
        run: |
          set -euo pipefail
          cat > ./trust-visual-review.mjs <<'EOF'
          import { chromium } from 'playwright';
          const base='http://127.0.0.1:4182';
          const routes=['/about','/contact','/methodology','/sources'];
          const browser=await chromium.launch({headless:true,channel:'chrome'});
          try {
            for (const viewport of [{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}]) {
              const context=await browser.newContext({viewport:{width:viewport.width,height:viewport.height}});
              const page=await context.newPage();
              for (const route of routes) {
                const res=await page.goto(base+route,{waitUntil:'networkidle'});
                if(!res||res.status()!==200) throw new Error(`${route} -> ${res?.status()}`);
                const state=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,bad:[...document.querySelectorAll('a[href]')].filter(a=>!a.getAttribute('href')||a.getAttribute('href')==='#').length}));
                if(state.sw>state.cw+1||state.bad) throw new Error(`${route}: visual/link state ${JSON.stringify(state)}`);
                const name=route.slice(1);
                await page.screenshot({path:`/tmp/qa-visual/${viewport.name}-${name}.png`,fullPage:true});
              }
              await context.close();
            }
          } finally { await browser.close(); }
          EOF
          node ./trust-visual-review.mjs
          rm -f ./trust-visual-review.mjs

      - name: Stop local Pages runtime
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/low-value-wrangler.pid ]]; then kill "$(cat /tmp/low-value-wrangler.pid)" 2>/dev/null || true; fi

      - name: Deploy isolated content preview only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          cd /tmp/ppl-low-value
          npx --yes wrangler@4.131.1 pages deploy . \
            --project-name "$PAGES_PROJECT" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message 'AdSense low-value content remediation preview — no production promotion'

      - name: Verify public preview content on the deployed artifact
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --output /tmp/live-home.html --write-out '%{http_code}' "$PREVIEW_ORIGIN/" || true)"
            curl --silent --show-error --fail "$PREVIEW_ORIGIN/enterprise-suite.js" -o /tmp/live-suite.js || true
            if [[ "$code" == 200 ]] && grep -Fq "ppl-final-build-marker:${GITHUB_SHA}" /tmp/live-suite.js 2>/dev/null; then ready=1; break; fi
            sleep 3
          done
          test "$ready" = 1
          rm -rf /tmp/qa-tool-content-live /tmp/qa-content-live
          mkdir -p /tmp/qa-tool-content-live /tmp/qa-content-live
          node tests/tool-content-runtime-qa.mjs "$PREVIEW_ORIGIN" /tmp/qa-tool-content-live
          node tests/content-value-audit.mjs "$PREVIEW_ORIGIN" /tmp/qa-content-live remediated

      - name: Upload final content and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-prep-lab-low-value-content-final-evidence
          path: |
            /tmp/qa-tool-content/
            /tmp/qa-tool-content-live/
            /tmp/qa-tool/
            /tmp/qa-content/
            /tmp/qa-content-live/
            /tmp/qa-final/
            /tmp/qa-crawl/
            /tmp/qa-visual/
            /tmp/low-value-wrangler.log
            release-artifacts/v119.1/print-prep-lab-pages-adsense-readiness-final.zip
          if-no-files-found: warn
          retention-days: 14
