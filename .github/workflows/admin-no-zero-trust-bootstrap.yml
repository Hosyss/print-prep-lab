name: Admin no-Zero-Trust isolated bootstrap

on:
  push:
    branches:
      - security/admin-control-plane-no-zero-trust-20260831
    paths:
      - .github/workflows/admin-no-zero-trust-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: print-prep-lab-admin-no-zero-trust-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/security/admin-control-plane-no-zero-trust-20260831'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_WORKER_NAME: print-prep-lab-admin
      ADMIN_D1_NAME: print-prep-lab-admin

    steps:
      - name: Check out isolated Admin branch
        uses: actions/checkout@v4

      - name: Confirm branch and decide whether bootstrap may run
        id: prereq
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/security/admin-control-plane-no-zero-trust-20260831"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${ADMIN_EMAILS:-}"
          test -f admin-control-plane/source/worker-no-zero-trust.js
          test -f admin-control-plane/source/wrangler-no-zero-trust.toml
          test -f admin-control-plane/source/migrations/0001_initial.sql
          test -f admin-control-plane/source/migrations/0002_auth_settings.sql

          if [[ -z "${ADMIN_PASSWORD:-}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Admin bootstrap waiting safely"
              echo
              echo "- ADMIN_PASSWORD repository secret: missing"
              echo "- Cloudflare mutations: none"
              echo "- main / Pages Production changes: none"
              echo "- Zero Trust / Access dependency: none"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if (( ${#ADMIN_PASSWORD} < 20 || ${#ADMIN_PASSWORD} > 256 )); then
            echo "::error::ADMIN_PASSWORD must be between 20 and 256 characters."
            exit 1
          fi

          if [[ "$ADMIN_PASSWORD" == "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::ADMIN_PASSWORD must be distinct from the Cloudflare API token."
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.prereq.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install isolated Admin dependencies
        if: steps.prereq.outputs.ready == 'true'
        working-directory: admin-control-plane/source
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Re-run the full Admin test suite before Cloudflare mutation
        if: steps.prereq.outputs.ready == 'true'
        working-directory: admin-control-plane/source
        run: |
          set -euo pipefail
          node --check worker-no-zero-trust.js
          node --check public/login.js
          npm test

      - name: Create or discover the dedicated D1 and workers.dev hostname
        if: steps.prereq.outputs.ready == 'true'
        id: resources
        shell: bash
        run: |
          set -euo pipefail

          cf_request() {
            local method="$1"
            local path="$2"
            local data="${3:-}"
            local outfile
            local status
            outfile="$(mktemp)"
            if [[ -n "$data" ]]; then
              status="$(curl --silent --show-error --output "$outfile" --write-out '%{http_code}' \
                -X "$method" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "$data" \
                "https://api.cloudflare.com/client/v4${path}" || true)"
            else
              status="$(curl --silent --show-error --output "$outfile" --write-out '%{http_code}' \
                -X "$method" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                "https://api.cloudflare.com/client/v4${path}" || true)"
            fi
            if [[ "$status" != "200" && "$status" != "201" ]]; then
              detail="$(jq -r '[.errors[]? | ((.code // "unknown")|tostring) + ": " + (.message // "unspecified Cloudflare error")] | join("; ")' "$outfile" 2>/dev/null || true)"
              [[ -n "$detail" ]] || detail="Cloudflare returned no parseable error message"
              echo "::error::Cloudflare request failed with HTTP ${status}: ${detail}" >&2
              rm -f "$outfile"
              return 1
            fi
            jq -e '.success == true' "$outfile" >/dev/null
            cat "$outfile"
            rm -f "$outfile"
          }

          d1_list="$(cf_request GET "/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100")"
          d1_id="$(jq -r --arg name "$ADMIN_D1_NAME" '[.result[] | select(.name == $name)][0].uuid // ""' <<<"$d1_list")"
          created=false
          if [[ -z "$d1_id" ]]; then
            create_result="$(cf_request POST "/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" "{\"name\":\"${ADMIN_D1_NAME}\"}")"
            d1_id="$(jq -r '.result.uuid // ""' <<<"$create_result")"
            created=true
          fi
          [[ "$d1_id" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "::error::Dedicated D1 UUID was not resolved."; exit 1; }

          subdomain_result="$(cf_request GET "/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")"
          worker_subdomain="$(jq -r '.result.subdomain // ""' <<<"$subdomain_result")"
          [[ "$worker_subdomain" =~ ^[a-z0-9-]+$ ]] || { echo "::error::Workers subdomain was not resolved."; exit 1; }

          echo "d1_id=$d1_id" >> "$GITHUB_OUTPUT"
          echo "worker_subdomain=$worker_subdomain" >> "$GITHUB_OUTPUT"
          echo "d1_created=$created" >> "$GITHUB_OUTPUT"
          echo "Dedicated D1 ready: yes"
          echo "Dedicated D1 created by this run: $created"
          echo "workers.dev hostname ready: yes"

      - name: Build a runtime-only Wrangler config with the exact D1 and origin
        if: steps.prereq.outputs.ready == 'true'
        id: runtime
        working-directory: admin-control-plane/source
        shell: bash
        env:
          D1_ID: ${{ steps.resources.outputs.d1_id }}
          WORKER_SUBDOMAIN: ${{ steps.resources.outputs.worker_subdomain }}
        run: |
          set -euo pipefail
          cp wrangler-no-zero-trust.toml wrangler-runtime.toml
          sed -i "s/REPLACE_AFTER_CREATING_D1/${D1_ID}/" wrangler-runtime.toml
          sed -i 's/^workers_dev = true$/workers_dev = false/' wrangler-runtime.toml
          printf '\nADMIN_ORIGIN = "https://%s.%s.workers.dev"\n' "$ADMIN_WORKER_NAME" "$WORKER_SUBDOMAIN" >> wrangler-runtime.toml
          grep -q "database_id = \"${D1_ID}\"" wrangler-runtime.toml
          grep -q '^workers_dev = false$' wrangler-runtime.toml
          ! grep -q 'REPLACE_AFTER_CREATING_D1' wrangler-runtime.toml
          echo "config=wrangler-runtime.toml" >> "$GITHUB_OUTPUT"

      - name: Deploy privately first so secrets can be installed off-public
        if: steps.prereq.outputs.ready == 'true'
        working-directory: admin-control-plane/source
        env:
          CONFIG: ${{ steps.runtime.outputs.config }}
        run: npx wrangler deploy --config "$CONFIG"

      - name: Install owner credentials and stable internal secrets
        if: steps.prereq.outputs.ready == 'true'
        working-directory: admin-control-plane/source
        shell: bash
        env:
          CONFIG: ${{ steps.runtime.outputs.config }}
        run: |
          set -euo pipefail

          secret_list="$(npx wrangler secret list --name "$ADMIN_WORKER_NAME" --config "$CONFIG" --format json)"
          has_secret() {
            jq -e --arg name "$1" '.[] | select(.name == $name)' <<<"$secret_list" >/dev/null 2>&1
          }
          put_secret() {
            local name="$1"
            local value="$2"
            printf '%s' "$value" | npx wrangler secret put "$name" --name "$ADMIN_WORKER_NAME" --config "$CONFIG" >/dev/null
            echo "Installed Worker secret: ${name}"
          }
          ensure_random_secret() {
            local name="$1"
            if has_secret "$name"; then
              echo "Stable Worker secret already exists: ${name}"
              return 0
            fi
            local value
            value="$(openssl rand -hex 32)"
            echo "::add-mask::${value}"
            put_secret "$name" "$value"
          }

          put_secret ADMIN_EMAILS "$ADMIN_EMAILS"
          put_secret ADMIN_PASSWORD "$ADMIN_PASSWORD"
          ensure_random_secret CSRF_SECRET
          ensure_random_secret AUDIT_SECRET
          ensure_random_secret SESSION_SECRET

      - name: Apply only the dedicated Admin D1 migrations
        if: steps.prereq.outputs.ready == 'true'
        working-directory: admin-control-plane/source
        env:
          CONFIG: ${{ steps.runtime.outputs.config }}
        run: npx wrangler d1 migrations apply DB --remote --config "$CONFIG"

      - name: Enable only the isolated Admin workers.dev endpoint
        if: steps.prereq.outputs.ready == 'true'
        working-directory: admin-control-plane/source
        env:
          CONFIG: ${{ steps.runtime.outputs.config }}
        run: |
          set -euo pipefail
          sed -i 's/^workers_dev = false$/workers_dev = true/' "$CONFIG"
          grep -q '^workers_dev = true$' "$CONFIG"
          npx wrangler deploy --config "$CONFIG"

      - name: Verify the live Admin boundary without signing in
        if: steps.prereq.outputs.ready == 'true'
        shell: bash
        env:
          WORKER_SUBDOMAIN: ${{ steps.resources.outputs.worker_subdomain }}
        run: |
          set -euo pipefail
          admin_url="https://${ADMIN_WORKER_NAME}.${WORKER_SUBDOMAIN}.workers.dev"

          root_status=""
          for attempt in $(seq 1 12); do
            root_status="$(curl --silent --show-error --output /tmp/admin-root.html --dump-header /tmp/admin-headers.txt --write-out '%{http_code}' "$admin_url/" || true)"
            [[ "$root_status" == "200" ]] && break
            sleep 2
          done
          [[ "$root_status" == "200" ]] || { echo "::error::Admin login page did not become reachable. HTTP ${root_status}"; exit 1; }
          grep -q 'Protected administration' /tmp/admin-root.html
          grep -Eqi '^cache-control:.*no-store' /tmp/admin-headers.txt
          grep -Eqi '^x-frame-options:.*DENY' /tmp/admin-headers.txt
          grep -Eqi '^content-security-policy:' /tmp/admin-headers.txt

          session_status="$(curl --silent --show-error --output /tmp/admin-session.json --write-out '%{http_code}' "$admin_url/api/session" || true)"
          [[ "$session_status" == "401" ]] || { echo "::error::Unauthenticated API boundary expected HTTP 401, got ${session_status}."; exit 1; }
          jq -e '.error == "session_required"' /tmp/admin-session.json >/dev/null

          echo "Admin login boundary reachable: yes"
          echo "Unauthenticated Admin API blocked: yes"
          echo "Security response headers present: yes"

      - name: Record isolated bootstrap result
        if: steps.prereq.outputs.ready == 'true'
        shell: bash
        env:
          WORKER_SUBDOMAIN: ${{ steps.resources.outputs.worker_subdomain }}
          D1_CREATED: ${{ steps.resources.outputs.d1_created }}
        run: |
          {
            echo "## Print Prep Lab Admin bootstrap"
            echo
            echo "- Architecture: dedicated Worker + dedicated D1"
            echo "- Authentication: owner password + first-login TOTP"
            echo "- Cloudflare Zero Trust / Access: not used"
            echo "- Dedicated D1 created this run: ${D1_CREATED}"
            echo "- Admin URL: https://${ADMIN_WORKER_NAME}.${WORKER_SUBDOMAIN}.workers.dev"
            echo "- Unauthenticated API boundary: verified blocked"
            echo "- main changed: no"
            echo "- Pages Production changed: no"
            echo "- Public Print Prep Lab integration: still disabled"
          } >> "$GITHUB_STEP_SUMMARY"
