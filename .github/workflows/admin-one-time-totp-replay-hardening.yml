name: Admin one-time TOTP replay hardening

on:
  push:
    branches:
      - security/admin-control-plane-no-zero-trust-20260831
    paths:
      - .github/workflows/admin-one-time-totp-replay-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    if: github.ref == 'refs/heads/security/admin-control-plane-no-zero-trust-20260831'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/admin-control-plane-no-zero-trust-20260831
          fetch-depth: 0

      - name: Add one-time TOTP step claiming
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('admin-control-plane/source/worker-no-zero-trust.js')
          source = path.read_text()

          old_verify = '''async function verifyTotp(secret, code, nowMs = Date.now()) {
            if (!/^\\d{6}$/.test(String(code || ""))) return false;
            const step = Math.floor(nowMs / 30_000);
            for (const delta of [-1, 0, 1]) {
              if (timingSafeEqual(await totpCode(secret, step + delta), String(code))) return true;
            }
            return false;
          }
          '''
          new_verify = '''async function verifyTotpStep(secret, code, nowMs = Date.now()) {
            if (!/^\\d{6}$/.test(String(code || ""))) return null;
            const currentStep = Math.floor(nowMs / 30_000);
            for (const delta of [-1, 0, 1]) {
              const candidateStep = currentStep + delta;
              if (timingSafeEqual(await totpCode(secret, candidateStep), String(code))) return candidateStep;
            }
            return null;
          }

          async function verifyTotp(secret, code, nowMs = Date.now()) {
            return Number.isInteger(await verifyTotpStep(secret, code, nowMs));
          }
          '''
          if source.count(old_verify) != 1:
            raise SystemExit(f'verifyTotp marker mismatch: {source.count(old_verify)}')
          source = source.replace(old_verify, new_verify, 1)

          marker = '''async function clearFailedLogin(bucket, env) {
            await env.DB.prepare("DELETE FROM rate_limits WHERE key = ? AND window_start = ?")
              .bind(bucket.key, bucket.windowStart).run();
          }
          '''
          addition = marker + '''
          async function claimTotpStep(env, email, step) {
            if (!Number.isInteger(step) || step < 0) throw new HttpError(401, "The sign-in details were rejected.", "invalid_credentials");
            const key = await hmacHex(requireSecret(env.AUDIT_SECRET, "AUDIT_SECRET"), `totp-replay:v1:${email}`);
            const now = Math.floor(Date.now() / 1000);
            const expiresAt = Math.max(now + 120, (step + 3) * 30);
            const result = await env.DB.prepare(
              "INSERT INTO rate_limits (key, window_start, count, expires_at) VALUES (?, ?, 1, ?) ON CONFLICT(key, window_start) DO NOTHING",
            ).bind(key, step, expiresAt).run();
            return databaseChanges(result) === 1;
          }
          '''
          if source.count(marker) != 1:
            raise SystemExit(f'clearFailedLogin marker mismatch: {source.count(marker)}')
          source = source.replace(marker, addition, 1)

          start = source.index('async function handleLogin(')
          end = source.index('\nasync function handleTotpSetup(', start)
          handle_login = '''async function handleLogin(request, env, origin, requestId) {
            requireJsonWrite(request, origin);
            const loginBucket = await enforceLoginRateLimit(request, env);
            const body = await readJson(request);
            const email = String(body.email || "").trim().toLowerCase();
            const password = String(body.password || "");
            const validIdentity = allowedEmails(env.ADMIN_EMAILS).has(email);
            const validPassword = timingSafeEqual(password, requirePassword(env.ADMIN_PASSWORD));
            if (!validIdentity || !validPassword) {
              await recordFailedLogin(loginBucket, env);
              throw new HttpError(401, "The sign-in details were rejected.", "invalid_credentials");
            }

            const row = await totpRow(env);
            if (row?.verified_at) {
              if (!body.totp) throw new HttpError(401, "Authenticator code is required.", "totp_required");
              const secret = await decryptTotpSecret(row, env);
              const matchedStep = await verifyTotpStep(secret, String(body.totp));
              if (!Number.isInteger(matchedStep)) {
                await recordFailedLogin(loginBucket, env);
                throw new HttpError(401, "The sign-in details were rejected.", "invalid_credentials");
              }
              const auth = { email };
              await withAdminWriteLease(env, async () => {
                if (!await claimTotpStep(env, email, matchedStep)) {
                  throw new HttpError(401, "The sign-in details were rejected.", "invalid_credentials");
                }
                const audit = await auditRecord(env, auth, requestId, "auth.login", "session", { mfa: "totp" });
                await auditStatement(env, audit).run();
              });
              await clearFailedLogin(loginBucket, env);
              const token = await signSession(email, "admin", env);
              return jsonResponse(
                { ok: true, authenticated: true, mfa: "totp" },
                200,
                { "Set-Cookie": sessionCookie(token, ADMIN_SESSION_SECONDS) },
              );
            }

            await clearFailedLogin(loginBucket, env);
            const token = await signSession(email, "totp-setup", env);
            return jsonResponse(
              { ok: true, authenticated: false, setupRequired: true },
              202,
              { "Set-Cookie": sessionCookie(token, SETUP_SESSION_SECONDS) },
            );
          }
          '''
          source = source[:start] + handle_login + source[end:]

          export_marker = '''  totpCode,
            verifyTotp,
          };'''
          export_replacement = '''  totpCode,
            verifyTotpStep,
            verifyTotp,
          };'''
          if source.count(export_marker) != 1:
            raise SystemExit(f'export marker mismatch: {source.count(export_marker)}')
          source = source.replace(export_marker, export_replacement, 1)

          path.write_text(source)
          PY

      - name: Add TOTP replay regression coverage
        shell: bash
        run: |
          set -euo pipefail
          cat > admin-control-plane/source/tests/totp-replay.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import path from "node:path";
          import { DatabaseSync } from "node:sqlite";
          import { fileURLToPath } from "node:url";
          import worker, { SESSION_COOKIE, totpCode, verifyTotpStep } from "../worker-no-zero-trust.js";

          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "..");
          const origin = "https://print-prep-lab-admin.test-account.workers.dev";

          class Statement {
            constructor(database, sql) { this.database = database; this.sql = sql; this.values = []; }
            bind(...values) { this.values = values; return this; }
            async first() { return this.database.prepare(this.sql).get(...this.values) || null; }
            async all() { return { results: this.database.prepare(this.sql).all(...this.values) }; }
            async run() { const result = this.database.prepare(this.sql).run(...this.values); return { meta: { changes: Number(result.changes) } }; }
          }

          class TestD1 {
            constructor() {
              this.database = new DatabaseSync(":memory:");
              this.database.exec(fs.readFileSync(path.join(root, "schema.sql"), "utf8"));
              this.database.exec(fs.readFileSync(path.join(root, "migrations/0002_auth_settings.sql"), "utf8"));
            }
            prepare(sql) { return new Statement(this.database, sql); }
            async batch(statements) {
              this.database.exec("BEGIN IMMEDIATE");
              try {
                const results = [];
                for (const statement of statements) results.push(await statement.run());
                this.database.exec("COMMIT");
                return results;
              } catch (error) {
                this.database.exec("ROLLBACK");
                throw error;
              }
            }
            close() { this.database.close(); }
          }

          function envFor(db) {
            return {
              ADMIN_EMAILS: "owner@example.com",
              ADMIN_PASSWORD: "A-very-long-owner-password-2026!",
              CSRF_SECRET: "csrf-" + "c".repeat(40),
              AUDIT_SECRET: "audit-" + "a".repeat(40),
              SESSION_SECRET: "session-" + "s".repeat(40),
              DB: db,
              ASSETS: { fetch: async () => new Response("admin") },
            };
          }

          function cookiePair(setCookie) {
            return String(setCookie || "").split(";", 1)[0];
          }

          function loginRequest(env, totp, ip = "203.0.113.120") {
            return worker.fetch(new Request(`${origin}/api/auth/login`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Origin: origin,
                "Sec-Fetch-Site": "same-origin",
                "CF-Connecting-IP": ip,
              },
              body: JSON.stringify({ email: "owner@example.com", password: env.ADMIN_PASSWORD, ...(totp ? { totp } : {}) }),
            }), env);
          }

          test("a valid TOTP step can open only one Admin login session and a fresh step is accepted", async () => {
            const db = new TestD1();
            const env = envFor(db);
            const realNow = Date.now;
            let nowMs = 1_800_000_000_000;
            Date.now = () => nowMs;
            try {
              const start = await loginRequest(env, null);
              assert.equal(start.status, 202);
              const setupCookie = cookiePair(start.headers.get("Set-Cookie"));
              assert.match(setupCookie, new RegExp(`^${SESSION_COOKIE}=`));

              const setup = await worker.fetch(new Request(`${origin}/api/auth/totp/setup`, {
                headers: { Cookie: setupCookie },
              }), env);
              assert.equal(setup.status, 200);
              const { secret } = await setup.json();

              const initialStep = Math.floor(nowMs / 30_000);
              const enrollmentCode = await totpCode(secret, initialStep);
              assert.equal(await verifyTotpStep(secret, enrollmentCode, nowMs), initialStep);

              const confirm = await worker.fetch(new Request(`${origin}/api/auth/totp/confirm`, {
                method: "POST",
                headers: {
                  Cookie: setupCookie,
                  "Content-Type": "application/json",
                  Origin: origin,
                  "Sec-Fetch-Site": "same-origin",
                },
                body: JSON.stringify({ totp: enrollmentCode }),
              }), env);
              assert.equal(confirm.status, 200);

              const first = await loginRequest(env, enrollmentCode);
              assert.equal(first.status, 200);
              assert.match(first.headers.get("Set-Cookie"), /HttpOnly/);

              const replay = await loginRequest(env, enrollmentCode);
              assert.equal(replay.status, 401);
              const replayBody = await replay.json();
              assert.equal(replayBody.error, "invalid_credentials");

              assert.equal(db.database.prepare("SELECT COUNT(*) AS count FROM audit_log WHERE action = 'auth.login'").get().count, 1);
              assert.equal(db.database.prepare("SELECT COUNT(*) AS count FROM rate_limits WHERE window_start = ?").get(initialStep).count, 1);

              do {
                nowMs += 30_000;
              } while (await totpCode(secret, Math.floor(nowMs / 30_000)) === enrollmentCode);
              const freshStep = Math.floor(nowMs / 30_000);
              const freshCode = await totpCode(secret, freshStep);
              const fresh = await loginRequest(env, freshCode);
              assert.equal(fresh.status, 200);
              assert.equal(db.database.prepare("SELECT COUNT(*) AS count FROM audit_log WHERE action = 'auth.login'").get().count, 2);
              assert.equal(db.database.prepare("SELECT COUNT(*) AS count FROM rate_limits WHERE window_start = ?").get(freshStep).count, 1);
            } finally {
              Date.now = realNow;
              db.close();
            }
          });
          EOF

      - name: Run complete Admin suite
        working-directory: admin-control-plane/source
        run: |
          set -euo pipefail
          node --check worker-no-zero-trust.js
          node --test tests/*.test.mjs

      - name: Commit verified TOTP replay hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hossam eldeen"
          git config user.email "52554618+Hosyss@users.noreply.github.com"
          git add admin-control-plane/source/worker-no-zero-trust.js admin-control-plane/source/tests/totp-replay.test.mjs
          git diff --cached --quiet && { echo "No TOTP replay hardening change to commit."; exit 1; }
          git commit -m "security: reject replayed admin TOTP steps"
          git push origin HEAD:security/admin-control-plane-no-zero-trust-20260831
