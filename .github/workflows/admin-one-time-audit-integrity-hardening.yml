name: Admin one-time audit integrity hardening

on:
  push:
    branches:
      - security/admin-control-plane-no-zero-trust-20260831
    paths:
      - .github/workflows/admin-one-time-audit-integrity-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    if: github.ref == 'refs/heads/security/admin-control-plane-no-zero-trust-20260831'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/admin-control-plane-no-zero-trust-20260831
          fetch-depth: 0

      - name: Patch rowid-based audit chaining and HMAC verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          worker_path = Path('admin-control-plane/source/worker-no-zero-trust.js')
          source = worker_path.read_text()

          source = source.replace(
            'const MAX_AUDIT_ROWS = 100;\n',
            'const MAX_AUDIT_ROWS = 100;\nconst MAX_AUDIT_VERIFY_ROWS = 5000;\n',
            1,
          )

          old_previous = 'const previous = await env.DB.prepare("SELECT entry_hash FROM audit_log ORDER BY occurred_at DESC, id DESC LIMIT 1").first();'
          new_previous = 'const previous = await env.DB.prepare("SELECT entry_hash FROM audit_log ORDER BY rowid DESC LIMIT 1").first();'
          if source.count(old_previous) != 1:
            raise SystemExit(f'Expected one legacy audit predecessor query, found {source.count(old_previous)}')
          source = source.replace(old_previous, new_previous)

          old_list = '''async function listAudit(env) {
            const rows = await env.DB.prepare("SELECT id, occurred_at, actor, action, resource, request_id, metadata, previous_hash, entry_hash FROM audit_log ORDER BY occurred_at DESC, id DESC LIMIT ?")
              .bind(MAX_AUDIT_ROWS).all();
            return (rows?.results || []).map((row) => ({
              id: row.id,
              occurredAt: row.occurred_at,
              actor: row.actor,
              action: row.action,
              resource: row.resource,
              requestId: row.request_id,
              metadata: JSON.parse(row.metadata),
              previousHash: row.previous_hash,
              entryHash: row.entry_hash,
            }));
          }
          '''
          new_list = '''async function listAudit(env) {
            const result = await env.DB.prepare("SELECT rowid AS sequence, id, occurred_at, actor, action, resource, request_id, metadata, previous_hash, entry_hash FROM audit_log ORDER BY rowid ASC LIMIT ?")
              .bind(MAX_AUDIT_VERIFY_ROWS + 1).all();
            const rows = result?.results || [];
            if (rows.length > MAX_AUDIT_VERIFY_ROWS) {
              throw new HttpError(503, "Audit history exceeds the verified read window.", "audit_verification_limit");
            }

            const entries = [];
            let expectedPreviousHash = "GENESIS";
            for (const row of rows) {
              let metadata;
              try {
                metadata = JSON.parse(row.metadata);
              } catch {
                throw new HttpError(500, "Audit chain integrity verification failed.", "audit_integrity_error");
              }
              const storedPreviousHash = String(row.previous_hash || "");
              const storedEntryHash = String(row.entry_hash || "");
              if (!timingSafeEqual(storedPreviousHash, expectedPreviousHash)) {
                throw new HttpError(500, "Audit chain integrity verification failed.", "audit_integrity_error");
              }
              const record = {
                id: String(row.id),
                occurredAt: String(row.occurred_at),
                actor: String(row.actor),
                action: String(row.action),
                resource: String(row.resource),
                requestId: String(row.request_id),
                metadata,
              };
              const expectedEntryHash = await hmacHex(
                requireSecret(env.AUDIT_SECRET, "AUDIT_SECRET"),
                `${expectedPreviousHash}.${canonicalStringify(record)}`,
              );
              if (!timingSafeEqual(storedEntryHash, expectedEntryHash)) {
                throw new HttpError(500, "Audit chain integrity verification failed.", "audit_integrity_error");
              }
              entries.push({ ...record, previousHash: storedPreviousHash, entryHash: storedEntryHash });
              expectedPreviousHash = storedEntryHash;
            }
            return entries.slice(-MAX_AUDIT_ROWS).reverse();
          }
          '''
          if source.count(old_list) != 1:
            raise SystemExit(f'Expected one legacy listAudit block, found {source.count(old_list)}')
          source = source.replace(old_list, new_list)

          old_api = 'if (url.pathname === "/api/audit" && request.method === "GET") return jsonResponse({ entries: await listAudit(env) });'
          new_api = 'if (url.pathname === "/api/audit" && request.method === "GET") return jsonResponse({ entries: await listAudit(env), integrityVerified: true });'
          if source.count(old_api) != 1:
            raise SystemExit(f'Expected one audit API route, found {source.count(old_api)}')
          source = source.replace(old_api, new_api)
          worker_path.write_text(source)

          admin_path = Path('admin-control-plane/source/public/admin.js')
          admin = admin_path.read_text()
          old_ui = '''    const result = await api("/api/audit");
            container.replaceChildren();
            if (!result.entries.length) {
          '''
          new_ui = '''    const result = await api("/api/audit");
            container.replaceChildren();
            if (result.integrityVerified !== true) throw new Error("Audit chain integrity verification failed.");
            container.append(createElement("p", "field-note", "Audit chain integrity verified by the server."));
            if (!result.entries.length) {
          '''
          if admin.count(old_ui) != 1:
            raise SystemExit(f'Expected one audit UI response block, found {admin.count(old_ui)}')
          admin = admin.replace(old_ui, new_ui)
          admin_path.write_text(admin)
          PY

      - name: Add permanent audit tamper regression test
        shell: bash
        run: |
          set -euo pipefail
          cat > admin-control-plane/source/tests/audit-integrity.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import path from "node:path";
          import { DatabaseSync } from "node:sqlite";
          import { fileURLToPath } from "node:url";
          import worker, { SESSION_COOKIE, signSession } from "../worker-no-zero-trust.js";

          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "..");
          const origin = "https://admin.example.com";

          class TestD1Statement {
            constructor(database, sql) { this.database = database; this.sql = sql; this.values = []; }
            bind(...values) { this.values = values; return this; }
            async first() { return this.database.prepare(this.sql).get(...this.values) || null; }
            async all() { return { results: this.database.prepare(this.sql).all(...this.values) }; }
            async run() {
              const result = this.database.prepare(this.sql).run(...this.values);
              return { meta: { changes: Number(result.changes) } };
            }
          }

          class TestD1 {
            constructor() {
              this.database = new DatabaseSync(":memory:");
              this.database.exec(fs.readFileSync(path.join(root, "schema.sql"), "utf8"));
              this.database.exec(fs.readFileSync(path.join(root, "migrations/0002_auth_settings.sql"), "utf8"));
            }
            prepare(sql) { return new TestD1Statement(this.database, sql); }
            async batch(statements) {
              this.database.exec("BEGIN IMMEDIATE");
              try {
                const results = [];
                for (const statement of statements) results.push(await statement.run());
                this.database.exec("COMMIT");
                return results;
              } catch (error) {
                this.database.exec("ROLLBACK");
                throw error;
              }
            }
            close() { this.database.close(); }
          }

          function envFor(database) {
            return {
              ADMIN_EMAILS: "owner@example.com",
              ADMIN_PASSWORD: "A-very-long-owner-password-2026!",
              ADMIN_ORIGIN: origin,
              CSRF_SECRET: "csrf-" + "c".repeat(40),
              AUDIT_SECRET: "audit-" + "a".repeat(40),
              SESSION_SECRET: "session-" + "s".repeat(40),
              DB: database,
              ASSETS: { fetch: async () => new Response("admin") },
            };
          }

          test("audit reads verify the complete HMAC chain and reject tampering", async () => {
            const database = new TestD1();
            const env = envFor(database);
            const token = await signSession("owner@example.com", "admin", env);
            const cookie = `${SESSION_COOKIE}=${token}`;

            const request = async (pathname, options = {}) => {
              const headers = new Headers(options.headers || {});
              headers.set("Cookie", cookie);
              headers.set("CF-Connecting-IP", "203.0.113.80");
              return worker.fetch(new Request(`${origin}${pathname}`, { ...options, headers }), env);
            };

            try {
              const session = await (await request("/api/session")).json();
              const initial = await (await request("/api/config")).json();
              const writeHeaders = {
                "Content-Type": "application/json",
                Origin: origin,
                "Sec-Fetch-Site": "same-origin",
                "X-CSRF-Token": session.csrfToken,
              };

              const first = await request("/api/config", {
                method: "PUT",
                headers: writeHeaders,
                body: JSON.stringify({ expectedRevision: 0, config: initial.config }),
              });
              assert.equal(first.status, 200);

              const secondConfig = structuredClone(initial.config);
              secondConfig.site.announcement.text = "Audit integrity regression";
              const second = await request("/api/config", {
                method: "PUT",
                headers: writeHeaders,
                body: JSON.stringify({ expectedRevision: 1, config: secondConfig }),
              });
              assert.equal(second.status, 200);

              const intact = await request("/api/audit");
              assert.equal(intact.status, 200);
              const intactBody = await intact.json();
              assert.equal(intactBody.integrityVerified, true);
              assert.equal(intactBody.entries.length, 2);

              database.database.prepare("UPDATE audit_log SET metadata = ? WHERE rowid = 1").run('{"tampered":true}');
              const tampered = await request("/api/audit");
              assert.equal(tampered.status, 500);
              assert.equal((await tampered.json()).error, "audit_integrity_error");
            } finally {
              database.close();
            }
          });

          test("active audit chaining uses insertion order rather than timestamp plus random UUID order", () => {
            const source = fs.readFileSync(path.join(root, "worker-no-zero-trust.js"), "utf8");
            assert.match(source, /SELECT entry_hash FROM audit_log ORDER BY rowid DESC LIMIT 1/);
            assert.doesNotMatch(source, /SELECT entry_hash FROM audit_log ORDER BY occurred_at DESC, id DESC LIMIT 1/);
            assert.match(source, /ORDER BY rowid ASC LIMIT \?/);
          });
          EOF

      - name: Run complete Admin suite
        working-directory: admin-control-plane/source
        run: node --test tests/*.test.mjs

      - name: Commit verified audit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hossam eldeen"
          git config user.email "52554618+Hosyss@users.noreply.github.com"
          git add admin-control-plane/source/worker-no-zero-trust.js admin-control-plane/source/public/admin.js admin-control-plane/source/tests/audit-integrity.test.mjs
          git diff --cached --quiet && { echo "No audit hardening change to commit."; exit 1; }
          git commit -m "security: verify admin audit HMAC chain on read"
          git push origin HEAD:security/admin-control-plane-no-zero-trust-20260831
