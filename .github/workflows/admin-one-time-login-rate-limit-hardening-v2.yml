name: Admin one-time failed-login rate-limit hardening v2

on:
  push:
    branches:
      - security/admin-control-plane-no-zero-trust-20260831
    paths:
      - .github/workflows/admin-one-time-login-rate-limit-hardening-v2.yml

permissions:
  contents: write

jobs:
  harden:
    if: github.ref == 'refs/heads/security/admin-control-plane-no-zero-trust-20260831'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/admin-control-plane-no-zero-trust-20260831
          fetch-depth: 0

      - name: Patch failed-login-only rate limiting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin-control-plane/source/worker-no-zero-trust.js')
          s = p.read_text()

          old = '''async function loginRateLimit(request, env) {
            if (!env.DB?.prepare) throw new HttpError(503, "Admin database is not configured.", "runtime_not_configured");
            const ip = request.headers.get("CF-Connecting-IP") || "unknown";
            const key = await hmacHex(requireSecret(env.AUDIT_SECRET, "AUDIT_SECRET"), `login:v1:${ip}`);
            const now = Math.floor(Date.now() / 1000);
            const windowStart = Math.floor(now / LOGIN_WINDOW_SECONDS) * LOGIN_WINDOW_SECONDS;
            await env.DB.prepare(
              "INSERT INTO rate_limits (key, window_start, count, expires_at) VALUES (?, ?, 1, ?) ON CONFLICT(key, window_start) DO UPDATE SET count = count + 1, expires_at = excluded.expires_at",
            ).bind(key, windowStart, windowStart + LOGIN_WINDOW_SECONDS * 2).run();
            const row = await env.DB.prepare("SELECT count FROM rate_limits WHERE key = ? AND window_start = ?").bind(key, windowStart).first();
            if (Number(row?.count || 0) > LOGIN_ATTEMPT_LIMIT) {
              throw new HttpError(429, "Too many sign-in attempts. Try again later.", "rate_limited", { "Retry-After": String(LOGIN_WINDOW_SECONDS) });
            }
          }
          '''
          new = '''async function loginRateBucket(request, env) {
            if (!env.DB?.prepare) throw new HttpError(503, "Admin database is not configured.", "runtime_not_configured");
            const ip = request.headers.get("CF-Connecting-IP") || "unknown";
            const key = await hmacHex(requireSecret(env.AUDIT_SECRET, "AUDIT_SECRET"), `login:v2:${ip}`);
            const now = Math.floor(Date.now() / 1000);
            const windowStart = Math.floor(now / LOGIN_WINDOW_SECONDS) * LOGIN_WINDOW_SECONDS;
            return { key, now, windowStart, expiresAt: windowStart + LOGIN_WINDOW_SECONDS * 2 };
          }

          async function enforceLoginRateLimit(request, env) {
            const bucket = await loginRateBucket(request, env);
            const row = await env.DB.prepare("SELECT count FROM rate_limits WHERE key = ? AND window_start = ?")
              .bind(bucket.key, bucket.windowStart).first();
            if (Number(row?.count || 0) >= LOGIN_ATTEMPT_LIMIT) {
              const retryAfter = Math.max(1, bucket.windowStart + LOGIN_WINDOW_SECONDS - bucket.now);
              throw new HttpError(429, "Too many failed sign-in attempts. Try again later.", "rate_limited", { "Retry-After": String(retryAfter) });
            }
            return bucket;
          }

          async function recordFailedLogin(bucket, env) {
            await env.DB.prepare(
              "INSERT INTO rate_limits (key, window_start, count, expires_at) VALUES (?, ?, 1, ?) ON CONFLICT(key, window_start) DO UPDATE SET count = count + 1, expires_at = excluded.expires_at",
            ).bind(bucket.key, bucket.windowStart, bucket.expiresAt).run();
          }

          async function clearFailedLogin(bucket, env) {
            await env.DB.prepare("DELETE FROM rate_limits WHERE key = ? AND window_start = ?")
              .bind(bucket.key, bucket.windowStart).run();
          }
          '''
          if s.count(old) != 1:
              raise SystemExit(f'legacy rate-limit block count={s.count(old)}')
          s = s.replace(old, new)

          pairs = [
            ('  await loginRateLimit(request, env);\n', '  const loginBucket = await enforceLoginRateLimit(request, env);\n'),
            ('  if (!validIdentity || !validPassword) throw new HttpError(401, "The sign-in details were rejected.", "invalid_credentials");\n',
             '  if (!validIdentity || !validPassword) {\n    await recordFailedLogin(loginBucket, env);\n    throw new HttpError(401, "The sign-in details were rejected.", "invalid_credentials");\n  }\n'),
            ('    if (!await verifyTotp(await decryptTotpSecret(row, env), String(body.totp))) {\n      throw new HttpError(401, "The sign-in details were rejected.", "invalid_credentials");\n    }\n    const auth = { email };\n',
             '    if (!await verifyTotp(await decryptTotpSecret(row, env), String(body.totp))) {\n      await recordFailedLogin(loginBucket, env);\n      throw new HttpError(401, "The sign-in details were rejected.", "invalid_credentials");\n    }\n    await clearFailedLogin(loginBucket, env);\n    const auth = { email };\n'),
            ('\n  const token = await signSession(email, "totp-setup", env);\n  return jsonResponse(\n',
             '\n  await clearFailedLogin(loginBucket, env);\n  const token = await signSession(email, "totp-setup", env);\n  return jsonResponse(\n'),
          ]
          for before, after in pairs:
              if s.count(before) != 1:
                  raise SystemExit(f'replacement count={s.count(before)} for {before[:50]!r}')
              s = s.replace(before, after)
          p.write_text(s)
          PY

      - name: Run complete Admin test suite
        working-directory: admin-control-plane/source
        run: node --test tests/*.test.mjs

      - name: Commit verified Worker change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hossam eldeen"
          git config user.email "52554618+Hosyss@users.noreply.github.com"
          git add admin-control-plane/source/worker-no-zero-trust.js
          git diff --cached --quiet && { echo "No Worker change to commit."; exit 1; }
          git commit -m "security: count only failed admin login attempts"
          git push origin HEAD:security/admin-control-plane-no-zero-trust-20260831
