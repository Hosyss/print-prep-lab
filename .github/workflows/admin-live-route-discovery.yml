name: Admin live route discovery

on:
  push:
    branches:
      - security/admin-control-plane-no-zero-trust-20260831
    paths:
      - .github/workflows/admin-live-route-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    if: github.ref == 'refs/heads/security/admin-control-plane-no-zero-trust-20260831'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out isolated Admin branch
        uses: actions/checkout@v4

      - name: Build read-only live route inventory and merged catalog candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import json
          import pathlib
          import re
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          base = 'https://printpreplab.pages.dev'
          catalog_path = pathlib.Path('admin-control-plane/source/public/site-catalog.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          existing = {page['route']: page for page in catalog['pages']}

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'PrintPrepLabAdminAudit/1.0'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return response.status, response.read(), response.headers.get('content-type', '')

          _, sitemap_body, _ = get(base + '/sitemap.xml')
          root = ET.fromstring(sitemap_body)
          routes = []
          for node in root.iter():
              if node.tag.endswith('loc') and node.text:
                  route = urllib.parse.urlparse(node.text.strip()).path or '/'
                  if route != '/' and route.endswith('/'):
                      route = route[:-1]
                  routes.append(route)
          sitemap_routes = set(routes)

          def text_match(pattern, text):
              m = re.search(pattern, text, flags=re.I | re.S)
              if not m:
                  return ''
              value = re.sub(r'<[^>]+>', ' ', m.group(1))
              return html.unescape(re.sub(r'\s+', ' ', value)).strip()

          inventory = []
          for route in sorted(sitemap_routes):
              status, body, content_type = get(base + route)
              decoded = body.decode('utf-8', errors='replace')
              title = text_match(r'<title[^>]*>(.*?)</title>', decoded)
              h1 = text_match(r'<h1[^>]*>(.*?)</h1>', decoded)
              description = ''
              m = re.search(r'<meta[^>]+name=["\']description["\'][^>]+content=["\'](.*?)["\']', decoded, flags=re.I | re.S)
              if not m:
                  m = re.search(r'<meta[^>]+content=["\'](.*?)["\'][^>]+name=["\']description["\']', decoded, flags=re.I | re.S)
              if m:
                  description = html.unescape(re.sub(r'\s+', ' ', m.group(1))).strip()
              if route.startswith('/tools/'):
                  kind = 'tool'
              elif route.startswith('/guides/'):
                  kind = 'guide'
              elif route.startswith('/sizes/'):
                  kind = 'size'
              elif route in {'/tools', '/guides', '/sizes', '/'}:
                  kind = 'hub'
              elif route in {'/privacy', '/terms', '/contact'}:
                  kind = 'policy'
              else:
                  kind = 'trust'
              inventory.append({
                  'route': route,
                  'title': title or h1 or route,
                  'h1': h1,
                  'description': description,
                  'kind': kind,
                  'status': status,
                  'contentType': content_type,
                  'alreadyManaged': route in existing,
                  'source': 'live-production-sitemap',
              })

          missing = [item for item in inventory if not item['alreadyManaged']]
          pathlib.Path('/tmp/live-route-inventory.json').write_text(json.dumps({
              'productionOrigin': base,
              'sitemapCount': len(inventory),
              'existingAdminCount': len(existing),
              'missingFromAdminCount': len(missing),
              'missingFromAdmin': missing,
              'sitemapInventory': inventory,
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          merged_pages = []
          for page in catalog['pages']:
              item = dict(page)
              item['sourceType'] = 'recovery-html'
              item['sourceRelease'] = 'v118.6'
              item['indexedInProduction'] = item['route'] in sitemap_routes
              merged_pages.append(item)

          for item in missing:
              merged_pages.append({
                  'route': item['route'],
                  'file': '',
                  'title': item['title'],
                  'kind': item['kind'],
                  'sourceType': 'production-sitemap',
                  'sourceRelease': 'main',
                  'indexedInProduction': True,
                  'baselineH1': item['h1'],
                  'baselineDescription': item['description'],
              })

          assert len(merged_pages) == 113, f'expected 113 merged routes, found {len(merged_pages)}'
          assert len({page['route'] for page in merged_pages}) == 113, 'merged routes are not unique'
          assert sitemap_routes.issubset({page['route'] for page in merged_pages}), 'a live sitemap route is still missing'

          merged = dict(catalog)
          merged['count'] = len(merged_pages)
          merged['source'] = 'hybrid: pinned v118.6 recovery HTML + current Production sitemap'
          merged['sourceProvenance'] = {
              'recoveryCommit': '07efaae843406f6cd9de74cb18ab5fffe2bf0a17',
              'recoveryArtifactSha256': 'd5b5ff59645402c06e86fe009d6474d8c2fcfc124ef3af29295f68428f9f6625',
              'productionOrigin': base,
              'productionSitemapRoutes': len(sitemap_routes),
              'recoveryManagedRoutes': len(existing),
              'unionManagedRoutes': len(merged_pages),
              'excludedSystemHtml': ['google6d67c58ff3b5201c.html'],
          }
          merged['pages'] = merged_pages
          pathlib.Path('/tmp/site-catalog-merged.json').write_text(json.dumps(merged, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print(f'Live sitemap routes: {len(inventory)}')
          print(f'Routes missing from old Admin: {len(missing)}')
          print(f'Merged Admin candidate routes: {len(merged_pages)}')
          for item in missing:
              print(f"{item['kind']}\t{item['route']}\t{item['title']}")
          PY

      - name: Upload discovery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: admin-live-route-inventory
          path: |
            /tmp/live-route-inventory.json
            /tmp/site-catalog-merged.json
          if-no-files-found: error
          retention-days: 1

      - name: Confirm discovery is read-only
        run: |
          echo 'Read-only discovery only: no Cloudflare API mutations, no deployment, no D1 writes, no main/Production writes.' >> "$GITHUB_STEP_SUMMARY"
