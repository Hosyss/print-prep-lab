name: Print Prep Lab final AdSense readiness preview

on:
  push:
    branches:
      - fix/adsense-readiness-final-20260917
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: print-prep-lab-adsense-readiness-final
  cancel-in-progress: true

jobs:
  final-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: printpreplab
      PREVIEW_BRANCH: adsense-readiness-preview
      PREVIEW_ORIGIN: https://adsense-readiness-preview.printpreplab.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build final pre-production artifact
        shell: bash
        run: |
          set -euo pipefail
          bash release-artifacts/v119.1/build-adsense-readiness.sh
          rm -rf /tmp/ppl-final
          mkdir -p /tmp/ppl-final
          unzip -q release-artifacts/v119.1/print-prep-lab-pages-adsense-readiness-final.zip -d /tmp/ppl-final
          test -s /tmp/ppl-final/_worker.js
          test -s /tmp/ppl-final/enterprise-suite.js
          test -s /tmp/ppl-final/search-index.json
          grep -Fq "decisionModel:'explicit-fields-v2'" /tmp/ppl-final/enterprise-suite.js
          grep -Fq "decisionModel:'explicit-eligibility-v1'" /tmp/ppl-final/enterprise-suite.js
          grep -Fq 'enterprise-job-cores-v2' /tmp/ppl-final/enterprise-suite.js
          grep -Fq 'JSON.stringify(id)' /tmp/ppl-final/jobs.js
          grep -Fq 'headers.delete("If-None-Match")' /tmp/ppl-final/_worker.js
          grep -Fq "ppl-final-build-marker:${GITHUB_SHA}" /tmp/ppl-final/enterprise-suite.js
          ! grep -Eq 'blockedWord|okayWord' /tmp/ppl-final/enterprise-suite.js
          ! grep -Fq 'value="Sample print job"' /tmp/ppl-final/job-core.html
          grep -Fq 'Who is it for?' /tmp/ppl-final/home-v112.html

      - name: Run affected state regressions
        shell: bash
        run: |
          set -euo pipefail
          node tests/phase2a-status-rules.test.mjs

      - name: Install browser QA dependency
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0

      - name: Start isolated local Pages runtime
        shell: bash
        run: |
          set -euo pipefail
          (
            cd /tmp/ppl-final
            env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
              npx --yes wrangler@4.131.1 pages dev . \
              --ip 127.0.0.1 --port 4176 \
              --compatibility-date=2026-05-22 --compatibility-flags=nodejs_compat
          ) >/tmp/final-wrangler.log 2>&1 &
          echo $! >/tmp/final-wrangler.pid
          ready=0
          for attempt in $(seq 1 80); do
            if curl --silent --fail http://127.0.0.1:4176/ >/dev/null; then ready=1; break; fi
            sleep .5
          done
          test "$ready" = 1

      - name: Run local affected-flow and whole-site QA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/qa-2a /tmp/qa-2b /tmp/qa-2c /tmp/qa-final-local /tmp/qa-final-flow /tmp/qa-tool-input /tmp/qa-crawl
          mkdir -p /tmp/qa-2a /tmp/qa-2b /tmp/qa-2c /tmp/qa-final-local /tmp/qa-final-flow /tmp/qa-tool-input /tmp/qa-crawl
          node tests/phase2a-browser-qa.mjs http://127.0.0.1:4176 /tmp/qa-2a
          node tests/phase2b-supplier-qa.mjs http://127.0.0.1:4176 /tmp/qa-2b
          node tests/phase2c-jobs-qa.mjs http://127.0.0.1:4176 /tmp/qa-2c
          node tests/final-site-audit.mjs http://127.0.0.1:4176 /tmp/ppl-final /tmp/qa-final-local
          node tests/final-readiness-qa.mjs http://127.0.0.1:4176 /tmp/qa-final-flow
          node tests/tool-input-qa.mjs http://127.0.0.1:4176 /tmp/qa-tool-input
          node tests/final-route-crawl.mjs http://127.0.0.1:4176 /tmp/ppl-final /tmp/qa-crawl
          curl -sS -D /tmp/reload-first.headers -o /tmp/reload-first.html http://127.0.0.1:4176/digital-twin
          etag="$(awk 'BEGIN{IGNORECASE=1} /^etag:/{sub(/\r$/,"",$2); print $2; exit}' /tmp/reload-first.headers)"
          test -n "$etag"
          code="$(curl -sS -o /tmp/reload-second.html -w '%{http_code}' -H "If-None-Match: $etag" http://127.0.0.1:4176/digital-twin)"
          echo "local conditional reload -> $code"
          test "$code" = 200
          grep -Fq '/enterprise-suite.js' /tmp/reload-second.html

      - name: Stop local Pages runtime
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/final-wrangler.pid ]]; then kill "$(cat /tmp/final-wrangler.pid)" 2>/dev/null || true; fi

      - name: Deploy isolated final preview only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          cd /tmp/ppl-final
          npx --yes wrangler@4.131.1 pages deploy . \
            --project-name "$PAGES_PROJECT" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message 'final AdSense readiness preview — no production promotion'

      - name: Verify preview identity critical HTTP and conditional reload
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --output /tmp/live-home.html --write-out '%{http_code}' "$PREVIEW_ORIGIN/" || true)"
            if [[ "$code" == 200 ]]; then ready=1; break; fi
            sleep 3
          done
          test "$ready" = 1
          for route in / /tools/print-readiness-checker /sizes/a4 /guides/print-file-preflight-checklist /about /contact /privacy /terms /supplier-intelligence /jobs /job-core /digital-twin; do
            code="$(curl --silent --output /tmp/live-route --write-out '%{http_code}' "$PREVIEW_ORIGIN${route}")"
            echo "$route -> $code"
            test "$code" = 200
          done
          curl --silent --show-error --fail -D /tmp/live-suite-headers "$PREVIEW_ORIGIN/enterprise-suite.js" -o /tmp/live-suite.js
          grep -Fq "ppl-final-build-marker:${GITHUB_SHA}" /tmp/live-suite.js
          grep -Eiq 'cache-control:.*max-age=0.*must-revalidate' /tmp/live-suite-headers
          test "$(curl --silent --output /tmp/ads.txt --write-out '%{http_code}' "$PREVIEW_ORIGIN/ads.txt")" = 200
          grep -Eq '^google\.com, *pub-[0-9]+, *DIRECT, *f08c47fec0942fa0' /tmp/ads.txt
          curl -sS -D /tmp/live-reload-first.headers -o /tmp/live-reload-first.html "$PREVIEW_ORIGIN/digital-twin"
          etag="$(awk 'BEGIN{IGNORECASE=1} /^etag:/{sub(/\r$/,"",$2); print $2; exit}' /tmp/live-reload-first.headers)"
          test -n "$etag"
          code="$(curl -sS -o /tmp/live-reload-second.html -w '%{http_code}' -H "If-None-Match: $etag" "$PREVIEW_ORIGIN/digital-twin")"
          echo "public conditional reload -> $code"
          test "$code" = 200
          grep -Fq '/enterprise-suite.js' /tmp/live-reload-second.html

      - name: Run public-preview QA for changed flows and whole site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/qa-2a-live /tmp/qa-2b-live /tmp/qa-2c-live /tmp/qa-final-live /tmp/qa-final-flow-live /tmp/qa-tool-input-live /tmp/qa-crawl-live
          mkdir -p /tmp/qa-2a-live /tmp/qa-2b-live /tmp/qa-2c-live /tmp/qa-final-live /tmp/qa-final-flow-live /tmp/qa-tool-input-live /tmp/qa-crawl-live
          node tests/phase2a-browser-qa.mjs "$PREVIEW_ORIGIN" /tmp/qa-2a-live
          node tests/phase2b-supplier-qa.mjs "$PREVIEW_ORIGIN" /tmp/qa-2b-live
          node tests/phase2c-jobs-qa.mjs "$PREVIEW_ORIGIN" /tmp/qa-2c-live
          node tests/final-site-audit.mjs "$PREVIEW_ORIGIN" /tmp/ppl-final /tmp/qa-final-live
          node tests/final-readiness-qa.mjs "$PREVIEW_ORIGIN" /tmp/qa-final-flow-live
          node tests/tool-input-qa.mjs "$PREVIEW_ORIGIN" /tmp/qa-tool-input-live
          node tests/final-route-crawl.mjs "$PREVIEW_ORIGIN" /tmp/ppl-final /tmp/qa-crawl-live

      - name: Upload final artifact and QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: print-prep-lab-final-adsense-readiness-qa
          path: |
            release-artifacts/v119.1/print-prep-lab-pages-adsense-readiness-final.zip
            /tmp/qa-2a/
            /tmp/qa-2b/
            /tmp/qa-2c/
            /tmp/qa-final-local/
            /tmp/qa-final-flow/
            /tmp/qa-tool-input/
            /tmp/qa-crawl/
            /tmp/qa-2a-live/
            /tmp/qa-2b-live/
            /tmp/qa-2c-live/
            /tmp/qa-final-live/
            /tmp/qa-final-flow-live/
            /tmp/qa-tool-input-live/
            /tmp/qa-crawl-live/
            /tmp/final-wrangler.log
            /tmp/reload-first.headers
            /tmp/live-reload-first.headers
          if-no-files-found: error
          retention-days: 14
