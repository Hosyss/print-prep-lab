name: Print Prep Lab final AdSense-readiness preview

on:
  push:
    branches:
      - fix/adsense-readiness-final-20260917

permissions:
  contents: read

concurrency:
  group: print-prep-lab-adsense-readiness-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: printpreplab
      PREVIEW_BRANCH: adsense-readiness-preview
      PREVIEW_ORIGIN: https://adsense-readiness-preview.printpreplab.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build layered final artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/adsense-source-patch.py
          npm ci --no-audit --no-fund
          npm run build
          npm run prepare:pages
          bash release-artifacts/v119.1/build-adsense-readiness.sh
          rm -rf /tmp/ppl-final
          mkdir -p /tmp/ppl-final
          unzip -q release-artifacts/v119.1/print-prep-lab-pages-adsense-readiness-final.zip -d /tmp/ppl-final
          test -s /tmp/ppl-final/_worker.js
          test -s /tmp/ppl-final/enterprise-suite.js
          test -s /tmp/ppl-final/jobs.js
          test -s /tmp/ppl-final/final-readiness.css
          grep -Fq "decisionModel:'explicit-fields-v2'" /tmp/ppl-final/enterprise-suite.js
          grep -Fq "decisionModel:'explicit-eligibility-v1'" /tmp/ppl-final/enterprise-suite.js
          grep -Fq 'selected-job-id-v1' /tmp/ppl-final/enterprise-suite.js
          ! grep -Eq 'blockedWord|okayWord' /tmp/ppl-final/enterprise-suite.js
          ! grep -Fq 'value="Sample print job"' /tmp/ppl-final/job-core.html
          grep -Fq 'Who is it for?' /tmp/ppl-final/home-v112.html
          grep -Fq 'headers.delete("If-None-Match")' /tmp/ppl-final/_worker.js

      - name: Install browser QA dependency
        shell: bash
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0

      - name: Run state-rule regression
        shell: bash
        run: node tests/phase2a-status-rules.test.mjs

      - name: Run all local browser and crawl gates
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/final-local-qa /tmp/final-local-crawl /tmp/phase2a-regression /tmp/tool-input-qa
          mkdir -p /tmp/final-local-qa /tmp/final-local-crawl /tmp/phase2a-regression /tmp/tool-input-qa
          (
            cd /tmp/ppl-final
            env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
              npx --yes wrangler@4.131.1 pages dev . \
              --ip 127.0.0.1 --port 4175 \
              --compatibility-date=2026-05-22 --compatibility-flags=nodejs_compat
          ) >/tmp/final-wrangler.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4175/digital-twin >/dev/null; then ready=1; break; fi
            sleep .5
          done
          test "$ready" = 1
          node tests/phase2a-browser-qa.mjs http://127.0.0.1:4175 /tmp/phase2a-regression
          node tests/final-readiness-qa.mjs http://127.0.0.1:4175 /tmp/final-local-qa
          node tests/tool-input-qa.mjs http://127.0.0.1:4175 /tmp/tool-input-qa
          node tests/final-route-crawl.mjs http://127.0.0.1:4175 /tmp/ppl-final /tmp/final-local-crawl

      - name: Reproduce and verify reload cache fix locally
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -D /tmp/reload-first.headers -o /tmp/reload-first.html http://127.0.0.1:4175/digital-twin
          etag="$(awk 'BEGIN{IGNORECASE=1} /^etag:/{sub(/\r$/,"",$2); print $2; exit}' /tmp/reload-first.headers)"
          test -n "$etag"
          code="$(curl -sS -o /tmp/reload-second.html -w '%{http_code}' -H "If-None-Match: $etag" http://127.0.0.1:4175/digital-twin)"
          echo "conditional reload -> $code"
          test "$code" = 200
          grep -Fq '/enterprise-suite.js' /tmp/reload-second.html

      - name: Deploy isolated final preview
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          cd /tmp/ppl-final
          npx --yes wrangler@4.131.1 pages deploy . \
            --project-name "$PAGES_PROJECT" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message 'final adsense-readiness review preview'

      - name: Verify public preview and reload behavior
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            code="$(curl -sS -o /tmp/live-home.html -w '%{http_code}' "$PREVIEW_ORIGIN/" || true)"
            if [[ "$code" == 200 ]] && grep -Fq 'Who is it for?' /tmp/live-home.html; then ready=1; break; fi
            sleep 3
          done
          test "$ready" = 1
          curl -sS -D /tmp/live-reload-first.headers -o /tmp/live-reload-first.html "$PREVIEW_ORIGIN/digital-twin"
          etag="$(awk 'BEGIN{IGNORECASE=1} /^etag:/{sub(/\r$/,"",$2); print $2; exit}' /tmp/live-reload-first.headers)"
          test -n "$etag"
          code="$(curl -sS -o /tmp/live-reload-second.html -w '%{http_code}' -H "If-None-Match: $etag" "$PREVIEW_ORIGIN/digital-twin")"
          echo "public conditional reload -> $code"
          test "$code" = 200
          grep -Fq '/enterprise-suite.js' /tmp/live-reload-second.html

      - name: Run final QA against public preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/final-live-qa /tmp/final-live-crawl /tmp/phase2a-live-regression /tmp/tool-input-live
          mkdir -p /tmp/final-live-qa /tmp/final-live-crawl /tmp/phase2a-live-regression /tmp/tool-input-live
          node tests/phase2a-browser-qa.mjs "$PREVIEW_ORIGIN" /tmp/phase2a-live-regression
          node tests/final-readiness-qa.mjs "$PREVIEW_ORIGIN" /tmp/final-live-qa
          node tests/tool-input-qa.mjs "$PREVIEW_ORIGIN" /tmp/tool-input-live
          node tests/final-route-crawl.mjs "$PREVIEW_ORIGIN" /tmp/ppl-final /tmp/final-live-crawl

      - name: Upload final review evidence
        uses: actions/upload-artifact@v4
        with:
          name: adsense-readiness-final-evidence
          path: |
            release-artifacts/v119.1/print-prep-lab-pages-adsense-readiness-final.zip
            /tmp/phase2a-regression/
            /tmp/final-local-qa/
            /tmp/final-local-crawl/
            /tmp/tool-input-qa/
            /tmp/phase2a-live-regression/
            /tmp/final-live-qa/
            /tmp/final-live-crawl/
            /tmp/tool-input-live/
            /tmp/final-wrangler.log
            /tmp/reload-first.headers
            /tmp/live-reload-first.headers
          if-no-files-found: error
          retention-days: 7
