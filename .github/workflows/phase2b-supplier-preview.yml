name: Print Prep Lab Phase 2b supplier eligibility preview

on:
  push:
    branches:
      - fix/phase2b-supplier-eligibility-20260916
    paths:
      - 'release-artifacts/v119.1/phase2b-supplier-patch.py'
      - 'release-artifacts/v119.1/build-phase2b.sh'
      - 'release-artifacts/v119.1/PHASE2B_SUPPLIER_RULES.md'
      - 'tests/phase2b-supplier-qa.mjs'
      - '.github/workflows/phase2b-supplier-preview.yml'

permissions:
  contents: read

concurrency:
  group: print-prep-lab-phase2b-supplier-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: printpreplab
      PREVIEW_BRANCH: phase2b-supplier-preview
      PREVIEW_ORIGIN: https://phase2b-supplier-preview.printpreplab.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build isolated Phase 2b artifact
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npm run prepare:pages
          bash release-artifacts/v119.1/build-phase2b.sh
          rm -rf /tmp/ppl-phase2b
          mkdir -p /tmp/ppl-phase2b
          unzip -q release-artifacts/v119.1/print-prep-lab-pages-v119-2b-supplier-eligibility.zip -d /tmp/ppl-phase2b
          test -s /tmp/ppl-phase2b/_worker.js
          test -s /tmp/ppl-phase2b/enterprise-suite.js
          test -s /tmp/ppl-phase2b/supplier-intelligence.html
          grep -Fq "decisionModel:'explicit-eligibility-v1'" /tmp/ppl-phase2b/enterprise-suite.js
          grep -Fq 'id="si-eligibility"' /tmp/ppl-phase2b/supplier-intelligence.html
          grep -Fq 'Weights are fixed in Phase 2' /tmp/ppl-phase2b/supplier-intelligence.html
          ! grep -Fq 'user-controlled weights' /tmp/ppl-phase2b/supplier-intelligence.html
          ! grep -Fq 'r.cap<70' /tmp/ppl-phase2b/enterprise-suite.js
          grep -Fq 'function jobCore()' /tmp/ppl-phase2b/enterprise-suite.js
          grep -Fq 'Who is it for?' /tmp/ppl-phase2b/home-v112.html

      - name: Run Phase 2a regression rules
        shell: bash
        run: |
          set -euo pipefail
          node tests/phase2a-status-rules.test.mjs

      - name: Run Phase 2b browser QA locally
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0
          rm -rf /tmp/phase2b-qa
          mkdir -p /tmp/phase2b-qa
          (
            cd /tmp/ppl-phase2b
            env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
              npx --yes wrangler@4.131.1 pages dev . \
              --ip 127.0.0.1 --port 4174 \
              --compatibility-date=2026-05-22 --compatibility-flags=nodejs_compat
          ) >/tmp/phase2b-wrangler.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4174/supplier-intelligence >/dev/null; then ready=1; break; fi
            sleep .5
          done
          test "$ready" = 1
          node tests/phase2b-supplier-qa.mjs http://127.0.0.1:4174 /tmp/phase2b-qa
          rm -rf /tmp/phase2a-regression
          mkdir -p /tmp/phase2a-regression
          node tests/phase2a-browser-qa.mjs http://127.0.0.1:4174 /tmp/phase2a-regression

      - name: Deploy isolated public preview
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          cd /tmp/ppl-phase2b
          npx --yes wrangler@4.131.1 pages deploy . \
            --project-name "$PAGES_PROJECT" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message 'phase 2b supplier eligibility preview'

      - name: Verify public preview
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 24); do
            code="$(curl --silent --show-error --output /tmp/live-si.html --write-out '%{http_code}' "$PREVIEW_ORIGIN/supplier-intelligence" || true)"
            if [[ "$code" == 200 ]] && grep -Fq 'id="si-eligibility"' /tmp/live-si.html; then ready=1; break; fi
            sleep 3
          done
          test "$ready" = 1
          for route in /supplier-intelligence /release-center /readiness-audit /digital-twin /command-center; do
            code="$(curl --silent --output /tmp/route.html --write-out '%{http_code}' "$PREVIEW_ORIGIN${route}")"
            echo "$route -> $code"
            test "$code" = 200
          done
          curl --silent --show-error --fail "$PREVIEW_ORIGIN/enterprise-suite.js" -o /tmp/live-suite.js
          grep -Fq "decisionModel:'explicit-eligibility-v1'" /tmp/live-suite.js
          ! grep -Fq 'r.cap<70' /tmp/live-suite.js

      - name: Run Phase 2b browser QA against public preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/phase2b-live-qa
          mkdir -p /tmp/phase2b-live-qa
          node tests/phase2b-supplier-qa.mjs "$PREVIEW_ORIGIN" /tmp/phase2b-live-qa

      - name: Upload Phase 2b build and QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2b-supplier-eligibility-qa
          path: |
            release-artifacts/v119.1/print-prep-lab-pages-v119-2b-supplier-eligibility.zip
            /tmp/phase2b-qa/
            /tmp/phase2b-live-qa/
            /tmp/phase2a-regression/
            /tmp/phase2b-wrangler.log
          if-no-files-found: error
          retention-days: 7
