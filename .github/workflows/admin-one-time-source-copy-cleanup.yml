name: Admin one-time source copy cleanup

on:
  push:
    branches:
      - security/admin-control-plane-no-zero-trust-20260831
    paths:
      - .github/workflows/admin-one-time-source-copy-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/security/admin-control-plane-no-zero-trust-20260831"

      - name: Check out exact isolated branch
        uses: actions/checkout@v4
        with:
          ref: security/admin-control-plane-no-zero-trust-20260831
          fetch-depth: 1

      - name: Replace stale Access wording in no-Zero-Trust Admin source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("admin-control-plane/source/public/admin.js")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'function setAccessState(ok, identity = "") {': 'function setSessionState(ok, identity = "") {',
              'chip.textContent = ok ? "Access verified" : "Protection check failed";': 'chip.textContent = ok ? "Session verified" : "Session check failed";',
              'byId("metric-access").textContent = ok ? "Verified" : "Blocked";': 'byId("metric-access").textContent = ok ? "Authenticated" : "Blocked";',
              'setAccessState(true, session.email);': 'setSessionState(true, session.email);',
              'setAccessState(false);': 'setSessionState(false);',
              'toast("Admin startup was blocked. Verify Cloudflare Access and the dedicated database.", true);': 'toast("Admin startup was blocked. Verify the protected session and the dedicated Admin database.", true);',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one occurrence of {old!r}, found {count}")
              text = text.replace(old, new)

          forbidden = [
              "function setAccessState",
              '"Access verified"',
              '"Protection check failed"',
              "Verify Cloudflare Access and the dedicated database",
          ]
          for marker in forbidden:
              if marker in text:
                  raise SystemExit(f"stale no-Zero-Trust source marker remains: {marker}")
          path.write_text(text, encoding="utf-8")
          PY

          node --check admin-control-plane/source/public/admin.js

      - name: Run full isolated Admin suite
        working-directory: admin-control-plane/source
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm test

      - name: Commit only the source cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':!admin-control-plane/source/public/admin.js' || {
            echo "::error::Unexpected file changes detected."
            exit 1
          }
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-control-plane/source/public/admin.js
          git commit -m "ui: remove stale Access wording from self-hosted admin"
          git push origin HEAD:security/admin-control-plane-no-zero-trust-20260831
