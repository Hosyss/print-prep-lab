name: Admin one-time session password binding

on:
  push:
    branches:
      - security/admin-control-plane-no-zero-trust-20260831
    paths:
      - .github/workflows/admin-one-time-session-password-binding.yml

permissions:
  contents: write

jobs:
  harden:
    if: github.ref == 'refs/heads/security/admin-control-plane-no-zero-trust-20260831'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/admin-control-plane-no-zero-trust-20260831
          fetch-depth: 0

      - name: Bind sessions to the active Admin password
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('admin-control-plane/source/worker-no-zero-trust.js')
          source = path.read_text()
          start = source.index('async function signSession(')
          end = source.index('\nasync function authenticate(', start)
          replacement = '''async function sessionCredentialBinding(env) {
            const sessionSecret = requireSecret(env.SESSION_SECRET, "SESSION_SECRET");
            const password = requirePassword(env.ADMIN_PASSWORD);
            return (await hmacHex(sessionSecret, `credential-binding:v1:${password}`)).slice(0, 32);
          }

          async function signSession(email, purpose, env, nowSeconds = Math.floor(Date.now() / 1000)) {
            const ttl = purpose === "totp-setup" ? SETUP_SESSION_SECONDS : ADMIN_SESSION_SECONDS;
            const payload = {
              v: 2,
              email,
              purpose,
              credentialBinding: await sessionCredentialBinding(env),
              iat: nowSeconds,
              exp: nowSeconds + ttl,
              jti: crypto.randomUUID(),
            };
            const encoded = bytesToBase64Url(encoder.encode(JSON.stringify(payload)));
            const signature = await hmacHex(requireSecret(env.SESSION_SECRET, "SESSION_SECRET"), `session:v2:${encoded}`);
            return `${encoded}.${signature}`;
          }

          async function verifySessionToken(token, env, expectedPurpose, nowSeconds = Math.floor(Date.now() / 1000)) {
            const parts = String(token || "").split(".");
            if (parts.length !== 2 || !/^[0-9a-f]{64}$/.test(parts[1])) {
              throw new HttpError(401, "Admin session is required.", "session_required");
            }
            const expected = await hmacHex(requireSecret(env.SESSION_SECRET, "SESSION_SECRET"), `session:v2:${parts[0]}`);
            if (!timingSafeEqual(parts[1], expected)) throw new HttpError(401, "Admin session was rejected.", "invalid_session");
            let payload;
            try {
              payload = JSON.parse(decoder.decode(base64UrlToBytes(parts[0])));
            } catch {
              throw new HttpError(401, "Admin session was rejected.", "invalid_session");
            }
            if (payload?.v !== 2 || payload?.purpose !== expectedPurpose || !Number.isInteger(payload?.iat) || !Number.isInteger(payload?.exp)) {
              throw new HttpError(401, "Admin session was rejected.", "invalid_session");
            }
            const expectedCredentialBinding = await sessionCredentialBinding(env);
            if (!timingSafeEqual(String(payload.credentialBinding || ""), expectedCredentialBinding)) {
              throw new HttpError(401, "Admin session was revoked by a credential change.", "invalid_session");
            }
            const maxTtl = expectedPurpose === "totp-setup" ? SETUP_SESSION_SECONDS : ADMIN_SESSION_SECONDS;
            if (payload.iat > nowSeconds + 30 || payload.exp <= nowSeconds || payload.exp - payload.iat > maxTtl + 30) {
              throw new HttpError(401, "Admin session expired.", "invalid_session");
            }
            const email = String(payload.email || "").trim().toLowerCase();
            if (!allowedEmails(env.ADMIN_EMAILS).has(email) || !/^[0-9a-f-]{36}$/i.test(String(payload.jti || ""))) {
              throw new HttpError(401, "Admin session was rejected.", "invalid_session");
            }
            return { email, purpose: payload.purpose, issuedAt: payload.iat, expiresAt: payload.exp, sessionId: payload.jti };
          }
          '''
          source = source[:start] + replacement + source[end:]
          path.write_text(source)
          PY

      - name: Add session-revocation regression coverage
        shell: bash
        run: |
          set -euo pipefail
          cat > admin-control-plane/source/tests/session-password-binding.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { signSession, verifySessionToken } from "../worker-no-zero-trust.js";

          const baseEnv = {
            ADMIN_EMAILS: "owner@example.com",
            ADMIN_PASSWORD: "First-very-long-admin-password-2026!",
            CSRF_SECRET: "csrf-" + "c".repeat(40),
            AUDIT_SECRET: "audit-" + "a".repeat(40),
            SESSION_SECRET: "session-" + "s".repeat(40),
          };

          test("rotating ADMIN_PASSWORD invalidates every previously issued admin session without rotating SESSION_SECRET", async () => {
            const now = 2_000_000_000;
            const token = await signSession("owner@example.com", "admin", baseEnv, now);
            const accepted = await verifySessionToken(token, baseEnv, "admin", now + 10);
            assert.equal(accepted.email, "owner@example.com");

            const rotated = { ...baseEnv, ADMIN_PASSWORD: "Second-very-long-admin-password-2026!" };
            await assert.rejects(
              () => verifySessionToken(token, rotated, "admin", now + 10),
              (error) => error?.status === 401 && error?.code === "invalid_session",
            );

            const replacement = await signSession("owner@example.com", "admin", rotated, now + 20);
            const replacementAccepted = await verifySessionToken(replacement, rotated, "admin", now + 21);
            assert.equal(replacementAccepted.email, "owner@example.com");
          });

          test("TOTP setup sessions remain bounded to the shorter setup lifetime", async () => {
            const now = 2_000_000_000;
            const token = await signSession("owner@example.com", "totp-setup", baseEnv, now);
            await verifySessionToken(token, baseEnv, "totp-setup", now + 599);
            await assert.rejects(
              () => verifySessionToken(token, baseEnv, "totp-setup", now + 601),
              (error) => error?.status === 401 && error?.code === "invalid_session",
            );
          });
          EOF

      - name: Run complete Admin suite
        working-directory: admin-control-plane/source
        run: |
          set -euo pipefail
          node --check worker-no-zero-trust.js
          node --test tests/*.test.mjs

      - name: Commit verified session hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hossam eldeen"
          git config user.email "52554618+Hosyss@users.noreply.github.com"
          git add admin-control-plane/source/worker-no-zero-trust.js admin-control-plane/source/tests/session-password-binding.test.mjs
          git diff --cached --quiet && { echo "No session hardening change to commit."; exit 1; }
          git commit -m "security: revoke sessions on admin password rotation"
          git push origin HEAD:security/admin-control-plane-no-zero-trust-20260831
