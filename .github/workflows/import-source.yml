name: Import Print Prep Lab source

on:
  push:
    paths:
      - "print-prep-lab-source.zip"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify source archive
        run: |
          echo "0ea26a368d9b3747b034323d633ba84d9e2fc0df636de44da815b40d2344fe92  print-prep-lab-source.zip" | sha256sum -c -
          unzip -t print-prep-lab-source.zip

      - name: Expand verified source
        run: |
          rm -f .bootstrap
          unzip -o print-prep-lab-source.zip -d .
          rm -f print-prep-lab-source.zip
          rm -rf .github/import
          rm -f .github/workflows/import-source.yml

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import verified Print Prep Lab source"
          git push
