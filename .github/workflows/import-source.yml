name: Import Print Prep Lab source

on:
  push:
    paths:
      - ".github/import/print-prep-lab-source.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expand verified source archive
        run: |
          rm -f .bootstrap
          unzip -o .github/import/print-prep-lab-source.zip -d .

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Import Print Prep Lab source"
          git push
