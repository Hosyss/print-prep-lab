name: Print Prep Lab reviewed AdSense production promotion

on:
  push:
    branches:
      - release/adsense-production-deploy-20260917
    paths:
      - .github/workflows/adsense-production-promote-20260917.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: print-prep-lab-reviewed-production-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: printpreplab
      PROD_ORIGIN: https://printpreplab.pages.dev
      REVIEWED_SHA: 5ef274ceb758b5dbde12d8d2ef1094774bea3e50
      QA_RUN_ID: '35234012540'
      QA_ARTIFACT: print-prep-lab-final-adsense-readiness-qa
      EXPECTED_APP_SHA256: 7f8e085deb90824ae13c5e14f7d03c0d6aec858e74e989e48ab61e5fc8c6bb6a

    steps:
      - name: Check out exact reviewed source for QA only
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEWED_SHA }}

      - name: Validate deployment credentials and production project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}" \
            > /tmp/cf-project.json
          jq -e '.success == true' /tmp/cf-project.json >/dev/null
          production_branch="$(jq -r '.result.production_branch // empty' /tmp/cf-project.json)"
          test -n "$production_branch"
          echo "production_branch=$production_branch" >> "$GITHUB_OUTPUT"
          echo "Cloudflare production branch: $production_branch"

      - name: Capture current production deployment for rollback
        id: before
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}/deployments?env=production&per_page=20" \
            > /tmp/cf-before.json
          jq -e '.success == true' /tmp/cf-before.json >/dev/null
          previous="$(jq -c '([.result[] | select((.latest_stage.status // "") == "success")][0] // .result[0] // empty)' /tmp/cf-before.json)"
          test -n "$previous"
          previous_id="$(jq -r '.id // empty' <<<"$previous")"
          previous_url="$(jq -r '.url // empty' <<<"$previous")"
          previous_commit="$(jq -r '.deployment_trigger.metadata.commit_hash // empty' <<<"$previous")"
          previous_created="$(jq -r '.created_on // empty' <<<"$previous")"
          test -n "$previous_id"
          echo "previous_id=$previous_id" >> "$GITHUB_OUTPUT"
          echo "previous_url=$previous_url" >> "$GITHUB_OUTPUT"
          echo "previous_commit=$previous_commit" >> "$GITHUB_OUTPUT"
          echo "previous_created=$previous_created" >> "$GITHUB_OUTPUT"
          echo "Previous production deployment: $previous_id"
          echo "Previous production URL: $previous_url"
          echo "Previous production commit: ${previous_commit:-unknown}"

      - name: Download the already-approved QA artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.QA_ARTIFACT }}
          run-id: ${{ env.QA_RUN_ID }}
          github-token: ${{ github.token }}
          path: /tmp/approved-qa-artifact

      - name: Verify and unpack exact approved application artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          app_zip="$(find /tmp/approved-qa-artifact -type f -name 'print-prep-lab-pages-adsense-readiness-final.zip' -print -quit)"
          test -n "$app_zip"
          actual_sha="$(sha256sum "$app_zip" | awk '{print $1}')"
          echo "Approved app ZIP SHA256: $actual_sha"
          test "$actual_sha" = "$EXPECTED_APP_SHA256"
          rm -rf /tmp/ppl-reviewed-production
          mkdir -p /tmp/ppl-reviewed-production
          unzip -q "$app_zip" -d /tmp/ppl-reviewed-production
          test -s /tmp/ppl-reviewed-production/_worker.js
          test -s /tmp/ppl-reviewed-production/enterprise-suite.js
          grep -Fq "ppl-final-build-marker:${REVIEWED_SHA}" /tmp/ppl-reviewed-production/enterprise-suite.js
          grep -Fq "decisionModel:'explicit-fields-v2'" /tmp/ppl-reviewed-production/enterprise-suite.js
          grep -Fq "decisionModel:'explicit-eligibility-v1'" /tmp/ppl-reviewed-production/enterprise-suite.js
          grep -Fq 'enterprise-job-cores-v2' /tmp/ppl-reviewed-production/enterprise-suite.js
          grep -Fq 'Who is it for?' /tmp/ppl-reviewed-production/home-v112.html
          grep -Eq '^google\.com, *pub-3369551572403499, *DIRECT, *f08c47fec0942fa0$' /tmp/ppl-reviewed-production/ads.txt
          grep -Fxq 'google-site-verification: google6d67c58ff3b5201c.html' /tmp/ppl-reviewed-production/google6d67c58ff3b5201c.html
          echo "app_zip=$app_zip" >> "$GITHUB_OUTPUT"
          echo "app_sha=$actual_sha" >> "$GITHUB_OUTPUT"

      - name: Deploy exact approved artifact to Cloudflare Pages production
        id: deploy
        shell: bash
        env:
          PRODUCTION_BRANCH: ${{ steps.project.outputs.production_branch }}
        run: |
          set -euo pipefail
          echo 'attempted=1' >> "$GITHUB_OUTPUT"
          cd /tmp/ppl-reviewed-production
          npx --yes wrangler@4.131.1 pages deploy . \
            --project-name "$PAGES_PROJECT" \
            --branch "$PRODUCTION_BRANCH" \
            --commit-hash "$REVIEWED_SHA" \
            --commit-message "Reviewed AdSense readiness release ${REVIEWED_SHA}"
          echo 'completed=1' >> "$GITHUB_OUTPUT"

      - name: Resolve new production Deployment ID
        id: after
        shell: bash
        run: |
          set -euo pipefail
          previous_id='${{ steps.before.outputs.previous_id }}'
          selected=''
          for attempt in $(seq 1 30); do
            curl -fsS \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}/deployments?env=production&per_page=20" \
              > /tmp/cf-after.json
            jq -e '.success == true' /tmp/cf-after.json >/dev/null
            selected="$(jq -c --arg old "$previous_id" --arg sha "$REVIEWED_SHA" '([.result[] | select(.id != $old and ((.deployment_trigger.metadata.commit_hash // "") == $sha) and ((.latest_stage.status // "") == "success"))][0] // [.result[] | select(.id != $old and ((.latest_stage.status // "") == "success"))][0] // empty)' /tmp/cf-after.json)"
            [[ -n "$selected" ]] && break
            sleep 3
          done
          test -n "$selected"
          deployment_id="$(jq -r '.id // empty' <<<"$selected")"
          deployment_url="$(jq -r '.url // empty' <<<"$selected")"
          deployment_commit="$(jq -r '.deployment_trigger.metadata.commit_hash // empty' <<<"$selected")"
          deployment_created="$(jq -r '.created_on // empty' <<<"$selected")"
          test -n "$deployment_id"
          test "$deployment_id" != "$previous_id"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "deployment_commit=$deployment_commit" >> "$GITHUB_OUTPUT"
          echo "deployment_created=$deployment_created" >> "$GITHUB_OUTPUT"
          echo "New production deployment: $deployment_id"
          echo "New production URL: $deployment_url"
          echo "Cloudflare deployment commit: ${deployment_commit:-unknown}"

      - name: Install production browser QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0

      - name: Verify production HTTP identity SEO AdSense and exclusions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod-http
          ready=0
          for attempt in $(seq 1 40); do
            code="$(curl --silent --show-error --output /tmp/prod-http/home.html --write-out '%{http_code}' "$PROD_ORIGIN/" || true)"
            curl --silent --show-error --fail "$PROD_ORIGIN/enterprise-suite.js" -o /tmp/prod-http/enterprise-suite.js || true
            if [[ "$code" == 200 ]] && grep -Fq "ppl-final-build-marker:${REVIEWED_SHA}" /tmp/prod-http/enterprise-suite.js 2>/dev/null; then
              ready=1
              break
            fi
            sleep 3
          done
          test "$ready" = 1

          for route in / /tools /tools/print-readiness-checker /sizes/a4 /guides/print-file-preflight-checklist /about /contact /privacy /terms /supplier-intelligence /jobs /job-core /digital-twin; do
            code="$(curl --silent --show-error --output /tmp/prod-http/route.html --write-out '%{http_code}' "$PROD_ORIGIN${route}")"
            echo "$route -> $code"
            test "$code" = 200
          done

          for asset in /enterprise-suite.js /jobs.js /ppl-app-v1186.js /ppl-ui-v111.css /robots.txt /sitemap.xml; do
            code="$(curl --silent --show-error --output /tmp/prod-http/asset --write-out '%{http_code}' "$PROD_ORIGIN${asset}")"
            echo "$asset -> $code"
            test "$code" = 200
          done

          test "$(curl --silent --show-error --output /tmp/prod-http/ads.txt --write-out '%{http_code}' "$PROD_ORIGIN/ads.txt")" = 200
          grep -Fxq 'google.com, pub-3369551572403499, DIRECT, f08c47fec0942fa0' /tmp/prod-http/ads.txt
          test "$(curl --silent --show-error --output /tmp/prod-http/google-verification --write-out '%{http_code}' "$PROD_ORIGIN/google6d67c58ff3b5201c.html")" = 200
          grep -Fxq 'google-site-verification: google6d67c58ff3b5201c.html' /tmp/prod-http/google-verification

          public_routes=(/ /tools /tools/print-readiness-checker /sizes/a4 /guides/print-file-preflight-checklist /about /contact /privacy /terms)
          for route in "${public_routes[@]}"; do
            curl -sS -D /tmp/prod-http/public.headers -o /tmp/prod-http/public.html "$PROD_ORIGIN${route}"
            if grep -Eqi '^x-robots-tag:.*noindex' /tmp/prod-http/public.headers; then
              echo "Unexpected noindex header on public route $route" >&2
              exit 1
            fi
            if grep -Eqi '<meta[^>]+name=["'"']robots["'"'][^>]+content=["'"'][^"'"']*noindex' /tmp/prod-http/public.html; then
              echo "Unexpected noindex meta on public route $route" >&2
              exit 1
            fi
            expected="https://printpreplab.pages.dev${route}"
            [[ "$route" == "/" ]] && expected='https://printpreplab.pages.dev/'
            grep -Fqi "rel=\"canonical\" href=\"$expected\"" /tmp/prod-http/public.html || grep -Fqi "href=\"$expected\" rel=\"canonical\"" /tmp/prod-http/public.html
            ! grep -Fq 'adsense-readiness-preview.printpreplab.pages.dev' /tmp/prod-http/public.html
            ! grep -Fq 'da60f490.printpreplab.pages.dev' /tmp/prod-http/public.html
          done

          excluded_routes=(/jobs /job-core /supplier-intelligence /digital-twin /workspace /search)
          for route in "${excluded_routes[@]}"; do
            curl -sS -D /tmp/prod-http/excluded.headers -o /tmp/prod-http/excluded.html "$PROD_ORIGIN${route}"
            grep -Eqi '^x-robots-tag:.*noindex' /tmp/prod-http/excluded.headers
          done

      - name: Run reviewed production behavior suites with local browser storage only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/prod-qa-2a /tmp/prod-qa-2b /tmp/prod-qa-2c /tmp/prod-final /tmp/prod-flow /tmp/prod-tool /tmp/prod-crawl
          mkdir -p /tmp/prod-qa-2a /tmp/prod-qa-2b /tmp/prod-qa-2c /tmp/prod-final /tmp/prod-flow /tmp/prod-tool /tmp/prod-crawl
          node tests/phase2a-browser-qa.mjs "$PROD_ORIGIN" /tmp/prod-qa-2a
          node tests/phase2b-supplier-qa.mjs "$PROD_ORIGIN" /tmp/prod-qa-2b
          node tests/phase2c-jobs-qa.mjs "$PROD_ORIGIN" /tmp/prod-qa-2c
          node tests/final-site-audit.mjs "$PROD_ORIGIN" /tmp/ppl-reviewed-production /tmp/prod-final
          node tests/final-readiness-qa.mjs "$PROD_ORIGIN" /tmp/prod-flow
          node tests/tool-input-qa.mjs "$PROD_ORIGIN" /tmp/prod-tool
          node tests/final-route-crawl.mjs "$PROD_ORIGIN" /tmp/ppl-reviewed-production /tmp/prod-crawl

      - name: Verify Arabic and 390px mobile behavior on affected pages
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/prod-mobile-ar.mjs <<'EOF'
          import { chromium } from 'playwright';
          const origin = process.env.PROD_ORIGIN;
          const routes = ['/', '/sizes/a4', '/tools/print-readiness-checker', '/jobs', '/job-core', '/supplier-intelligence'];
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({viewport:{width:390,height:844}});
          const page = await context.newPage();
          for (const route of routes) {
            await page.goto(origin + route, {waitUntil:'networkidle'});
            const lang = page.locator('select[data-lang]').first();
            if (await lang.count()) {
              await lang.selectOption('ar');
              await page.waitForTimeout(150);
            }
            const result = await page.evaluate(() => ({
              dir: document.documentElement.dir || document.body.dir || '',
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth
            }));
            if (result.dir !== 'rtl') throw new Error(`${route}: Arabic did not set RTL (${result.dir})`);
            if (result.scrollWidth > result.clientWidth + 1) throw new Error(`${route}: page-level horizontal overflow ${result.scrollWidth}>${result.clientWidth}`);
            console.log(`${route} Arabic mobile PASS ${result.clientWidth}px`);
          }
          await browser.close();
          EOF
          node /tmp/prod-mobile-ar.mjs

      - name: Write successful production deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Print Prep Lab reviewed Production deployment'
            echo
            echo "- Reviewed application SHA: $REVIEWED_SHA"
            echo "- Approved application ZIP SHA256: $EXPECTED_APP_SHA256"
            echo "- Previous Deployment ID: ${{ steps.before.outputs.previous_id }}"
            echo "- Previous deployment URL: ${{ steps.before.outputs.previous_url }}"
            echo "- New Deployment ID: ${{ steps.after.outputs.deployment_id }}"
            echo "- New deployment URL: ${{ steps.after.outputs.deployment_url }}"
            echo "- Production: $PROD_ORIGIN"
            echo '- HTTP/routes/assets: PASS'
            echo '- AdSense ads.txt + Google verification: PASS'
            echo '- canonical/public indexability/operational noindex: PASS'
            echo '- Phase 2A + Supplier + Jobs/Job Core production QA: PASS'
            echo '- Arabic + 390px mobile affected-page check: PASS'
            echo '- Rollback performed: no'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back to captured previous production deployment on failure
        id: rollback
        if: failure() && steps.deploy.outputs.attempted == '1' && steps.before.outputs.previous_id != ''
        shell: bash
        run: |
          set -euo pipefail
          previous_id='${{ steps.before.outputs.previous_id }}'
          echo "Rolling back Production to $previous_id"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}/deployments/${previous_id}/rollback" \
            > /tmp/cf-rollback.json
          jq -e '.success == true' /tmp/cf-rollback.json >/dev/null
          ready=0
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --output /tmp/rollback-home.html --write-out '%{http_code}' "$PROD_ORIGIN/" || true)"
            [[ "$code" == 200 ]] && { ready=1; break; }
            sleep 3
          done
          test "$ready" = 1
          echo 'performed=1' >> "$GITHUB_OUTPUT"
          {
            echo '## Production rollback executed'
            echo
            echo "- Failed reviewed SHA: $REVIEWED_SHA"
            echo "- Restored previous Deployment ID: $previous_id"
            echo "- Previous deployment URL: ${{ steps.before.outputs.previous_url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-prep-lab-production-promotion-evidence
          path: |
            /tmp/cf-project.json
            /tmp/cf-before.json
            /tmp/cf-after.json
            /tmp/cf-rollback.json
            /tmp/prod-http/
            /tmp/prod-qa-2a/
            /tmp/prod-qa-2b/
            /tmp/prod-qa-2c/
            /tmp/prod-final/
            /tmp/prod-flow/
            /tmp/prod-tool/
            /tmp/prod-crawl/
          if-no-files-found: warn
          retention-days: 14
