name: Admin one-time bundle isolation audit

on:
  push:
    branches:
      - security/admin-control-plane-no-zero-trust-20260831
    paths:
      - .github/workflows/admin-one-time-bundle-isolation-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enforce isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/security/admin-control-plane-no-zero-trust-20260831"

      - name: Check out isolated Admin branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install isolated Admin dependencies
        working-directory: admin-control-plane/source
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build no-Zero-Trust Worker locally with Wrangler
        working-directory: admin-control-plane/source
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler-no-zero-trust.toml wrangler-bundle-audit.toml
          sed -i 's/REPLACE_AFTER_CREATING_D1/00000000-0000-0000-0000-000000000000/' wrangler-bundle-audit.toml
          printf '\nADMIN_ORIGIN = "https://print-prep-lab-admin.example.invalid"\n' >> wrangler-bundle-audit.toml
          rm -rf /tmp/ppl-admin-bundle
          npx wrangler deploy --dry-run --outdir /tmp/ppl-admin-bundle --config wrangler-bundle-audit.toml
          find /tmp/ppl-admin-bundle -maxdepth 2 -type f -print

      - name: Reject bundled Cloudflare Access runtime markers
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t js_files < <(find /tmp/ppl-admin-bundle -type f -name '*.js' -o -name '*.mjs')
          ((${#js_files[@]} > 0)) || { echo '::error::No bundled JavaScript output found.'; exit 1; }
          forbidden='cloudflareaccess\.com|CF_ACCESS_|Cf-Access-Jwt-Assertion|CF_Authorization|cloudflare-access-policy'
          if grep -Eni "$forbidden" "${js_files[@]}"; then
            echo '::error::Legacy Cloudflare Access runtime markers were bundled into the no-Zero-Trust Worker.'
            exit 1
          fi
          echo 'Bundled no-Zero-Trust Worker contains no legacy Cloudflare Access runtime markers.'
