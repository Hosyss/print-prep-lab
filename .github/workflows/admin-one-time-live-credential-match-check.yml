name: Admin one-time live credential match check

on:
  push:
    branches:
      - security/admin-control-plane-no-zero-trust-20260831
    paths:
      - .github/workflows/admin-one-time-live-credential-match-check.yml

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/security/admin-control-plane-no-zero-trust-20260831'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_URL: https://print-prep-lab-admin.buildtools.workers.dev
    steps:
      - name: Compare current GitHub admin credentials against the live Worker without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${ADMIN_EMAILS:-}"
          test -n "${ADMIN_PASSWORD:-}"
          echo "::add-mask::${ADMIN_PASSWORD}"

          IFS=',; ' read -r -a emails <<< "$ADMIN_EMAILS"
          cleaned=()
          for raw in "${emails[@]}"; do
            email="$(printf '%s' "$raw" | tr -d '\r\n\t ' | tr '[:upper:]' '[:lower:]')"
            [[ -n "$email" ]] || continue
            echo "::add-mask::${email}"
            cleaned+=("$email")
          done

          count="${#cleaned[@]}"
          (( count > 0 )) || { echo "::error::ADMIN_EMAILS contains no usable addresses."; exit 1; }
          (( count <= 5 )) || { echo "::error::Refusing to consume more than five login attempts."; exit 1; }

          matched=false
          rate_limited=false
          attempts=0
          for email in "${cleaned[@]}"; do
            attempts=$((attempts + 1))
            payload="$(jq -cn --arg email "$email" --arg password "$ADMIN_PASSWORD" '{email:$email,password:$password}')"
            response_file="$(mktemp)"
            status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              -X POST \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              -H 'Origin: https://print-prep-lab-admin.buildtools.workers.dev' \
              -H 'Sec-Fetch-Site: same-origin' \
              --data-binary "$payload" \
              "$ADMIN_URL/api/auth/login" || true)"
            code="$(jq -r '.error // ""' "$response_file" 2>/dev/null || true)"
            rm -f "$response_file"

            if [[ "$status" == "401" && "$code" == "totp_required" ]]; then
              matched=true
              break
            fi
            if [[ "$status" == "200" || "$status" == "202" ]]; then
              matched=true
              break
            fi
            if [[ "$status" == "429" && "$code" == "rate_limited" ]]; then
              rate_limited=true
              break
            fi
          done

          {
            echo "## Live credential match diagnostic"
            echo
            echo "- Current GitHub ADMIN_EMAILS entries checked: ${count}"
            echo "- Login attempts consumed: ${attempts}"
            echo "- Current GitHub admin credential pair accepted by the live Worker: ${matched}"
            echo "- Live login rate limit blocked the diagnostic: ${rate_limited}"
            echo "- Secret values printed: no"
            echo "- Worker secrets changed: no"
            echo "- Worker source deployed: no"
            echo "- D1 configuration/backups/audit/snapshots changed: no"
            echo "- Only normal login rate-limit counters may have incremented"
            echo "- main / Pages Production changed: no"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$rate_limited" == "true" ]]; then
            echo "::error::Live login rate limit prevented a conclusive credential check."
            exit 2
          fi

          if [[ "$matched" != "true" ]]; then
            echo "::error::The current GitHub ADMIN_EMAILS + ADMIN_PASSWORD pair is not accepted by the live Worker."
            exit 3
          fi

          echo "Current GitHub admin credentials are accepted by the live Worker."
