name: Admin one-time account TOTP attempt budget

on:
  push:
    branches:
      - security/admin-control-plane-no-zero-trust-20260831
    paths:
      - .github/workflows/admin-one-time-account-totp-budget.yml

permissions:
  contents: write

jobs:
  harden:
    if: github.ref == 'refs/heads/security/admin-control-plane-no-zero-trust-20260831'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/admin-control-plane-no-zero-trust-20260831
          fetch-depth: 0

      - name: Add account-wide post-password TOTP attempt budget
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('admin-control-plane/source/worker-no-zero-trust.js')
          source = path.read_text()

          constant_marker = 'const LOGIN_ATTEMPT_LIMIT = 5;\n'
          constants = '''const LOGIN_ATTEMPT_LIMIT = 5;
          const TOTP_ATTEMPT_WINDOW_SECONDS = 10 * 60;
          const TOTP_ATTEMPT_LIMIT = 10;
          '''
          if source.count(constant_marker) != 1:
            raise SystemExit(f'login constant marker mismatch: {source.count(constant_marker)}')
          source = source.replace(constant_marker, constants, 1)

          clear_marker = '''async function clearFailedLogin(bucket, env) {
            await env.DB.prepare("DELETE FROM rate_limits WHERE key = ? AND window_start = ?")
              .bind(bucket.key, bucket.windowStart).run();
          }
          '''
          budget_helper = clear_marker + '''
          async function consumeTotpAttemptBudget(env, email) {
            const key = await hmacHex(requireSecret(env.AUDIT_SECRET, "AUDIT_SECRET"), `totp-attempt:v1:${email}`);
            const now = Math.floor(Date.now() / 1000);
            const windowStart = Math.floor(now / TOTP_ATTEMPT_WINDOW_SECONDS) * TOTP_ATTEMPT_WINDOW_SECONDS;
            const expiresAt = windowStart + TOTP_ATTEMPT_WINDOW_SECONDS * 2;
            await env.DB.prepare(
              "INSERT INTO rate_limits (key, window_start, count, expires_at) VALUES (?, ?, 1, ?) ON CONFLICT(key, window_start) DO UPDATE SET count = count + 1, expires_at = excluded.expires_at",
            ).bind(key, windowStart, expiresAt).run();
            const row = await env.DB.prepare("SELECT count FROM rate_limits WHERE key = ? AND window_start = ?")
              .bind(key, windowStart).first();
            const count = Number(row?.count || 0);
            if (count > TOTP_ATTEMPT_LIMIT) {
              const retryAfter = Math.max(1, windowStart + TOTP_ATTEMPT_WINDOW_SECONDS - now);
              throw new HttpError(429, "Too many failed sign-in attempts. Try again later.", "rate_limited", { "Retry-After": String(retryAfter) });
            }
            return { key, windowStart };
          }
          '''
          if source.count(clear_marker) != 1:
            raise SystemExit(f'clear bucket marker mismatch: {source.count(clear_marker)}')
          source = source.replace(clear_marker, budget_helper, 1)

          old_totp_start = '''  if (row?.verified_at) {
            if (!body.totp) throw new HttpError(401, "Authenticator code is required.", "totp_required");
            const secret = await decryptTotpSecret(row, env);
          '''
          new_totp_start = '''  if (row?.verified_at) {
            if (!body.totp) throw new HttpError(401, "Authenticator code is required.", "totp_required");
            const totpAttemptBucket = await consumeTotpAttemptBudget(env, email);
            const secret = await decryptTotpSecret(row, env);
          '''
          if source.count(old_totp_start) != 1:
            raise SystemExit(f'TOTP login start marker mismatch: {source.count(old_totp_start)}')
          source = source.replace(old_totp_start, new_totp_start, 1)

          old_success = '''    await clearFailedLogin(loginBucket, env);
            const token = await signSession(email, "admin", env);
          '''
          new_success = '''    await clearFailedLogin(loginBucket, env);
            await clearFailedLogin(totpAttemptBucket, env);
            const token = await signSession(email, "admin", env);
          '''
          if source.count(old_success) != 1:
            raise SystemExit(f'login success marker mismatch: {source.count(old_success)}')
          source = source.replace(old_success, new_success, 1)

          path.write_text(source)
          PY

      - name: Add distributed-IP TOTP budget regression coverage
        shell: bash
        run: |
          set -euo pipefail
          cat > admin-control-plane/source/tests/totp-account-budget.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import path from "node:path";
          import { DatabaseSync } from "node:sqlite";
          import { fileURLToPath } from "node:url";
          import worker, { totpCode } from "../worker-no-zero-trust.js";

          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "..");
          const origin = "https://print-prep-lab-admin.test-account.workers.dev";

          class Statement {
            constructor(database, sql) { this.database = database; this.sql = sql; this.values = []; }
            bind(...values) { this.values = values; return this; }
            async first() { return this.database.prepare(this.sql).get(...this.values) || null; }
            async all() { return { results: this.database.prepare(this.sql).all(...this.values) }; }
            async run() { const result = this.database.prepare(this.sql).run(...this.values); return { meta: { changes: Number(result.changes) } }; }
          }

          class TestD1 {
            constructor() {
              this.database = new DatabaseSync(":memory:");
              this.database.exec(fs.readFileSync(path.join(root, "schema.sql"), "utf8"));
              this.database.exec(fs.readFileSync(path.join(root, "migrations/0002_auth_settings.sql"), "utf8"));
            }
            prepare(sql) { return new Statement(this.database, sql); }
            async batch(statements) {
              this.database.exec("BEGIN IMMEDIATE");
              try {
                const results = [];
                for (const statement of statements) results.push(await statement.run());
                this.database.exec("COMMIT");
                return results;
              } catch (error) {
                this.database.exec("ROLLBACK");
                throw error;
              }
            }
            close() { this.database.close(); }
          }

          function envFor(db) {
            return {
              ADMIN_EMAILS: "owner@example.com",
              ADMIN_PASSWORD: "A-very-long-owner-password-2026!",
              CSRF_SECRET: "csrf-" + "c".repeat(40),
              AUDIT_SECRET: "audit-" + "a".repeat(40),
              SESSION_SECRET: "session-" + "s".repeat(40),
              DB: db,
              ASSETS: { fetch: async () => new Response("admin") },
            };
          }

          function cookiePair(value) { return String(value || "").split(";", 1)[0]; }

          function loginRequest(env, totp, ip) {
            return worker.fetch(new Request(`${origin}/api/auth/login`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Origin: origin,
                "Sec-Fetch-Site": "same-origin",
                "CF-Connecting-IP": ip,
              },
              body: JSON.stringify({ email: "owner@example.com", password: env.ADMIN_PASSWORD, ...(totp ? { totp } : {}) }),
            }), env);
          }

          async function enroll(env) {
            const start = await loginRequest(env, null, "203.0.113.10");
            assert.equal(start.status, 202);
            const setupCookie = cookiePair(start.headers.get("Set-Cookie"));
            const setup = await worker.fetch(new Request(`${origin}/api/auth/totp/setup`, { headers: { Cookie: setupCookie } }), env);
            assert.equal(setup.status, 200);
            const { secret } = await setup.json();
            const code = await totpCode(secret, Math.floor(Date.now() / 30_000));
            const confirm = await worker.fetch(new Request(`${origin}/api/auth/totp/confirm`, {
              method: "POST",
              headers: { Cookie: setupCookie, "Content-Type": "application/json", Origin: origin, "Sec-Fetch-Site": "same-origin" },
              body: JSON.stringify({ totp: code }),
            }), env);
            assert.equal(confirm.status, 200);
            return secret;
          }

          async function wrongCodeFor(secret, step) {
            const forbidden = new Set();
            for (const delta of [-1, 0, 1]) forbidden.add(await totpCode(secret, step + delta));
            for (let value = 0; value < 1_000_000; value += 1) {
              const code = String(value).padStart(6, "0");
              if (!forbidden.has(code)) return code;
            }
            throw new Error("Unable to construct a non-matching TOTP code.");
          }

          test("correct-password TOTP guesses share one strict account budget across distributed IP addresses", async () => {
            const db = new TestD1();
            const env = envFor(db);
            const realNow = Date.now;
            let nowMs = 1_800_000_000_000;
            Date.now = () => nowMs;
            try {
              const secret = await enroll(env);
              const step = Math.floor(nowMs / 30_000);
              const wrong = await wrongCodeFor(secret, step);

              for (let attempt = 0; attempt < 10; attempt += 1) {
                const response = await loginRequest(env, wrong, `198.51.100.${20 + attempt}`);
                assert.equal(response.status, 401);
                assert.equal((await response.json()).error, "invalid_credentials");
              }

              const correct = await totpCode(secret, step);
              const blocked = await loginRequest(env, correct, "198.51.100.99");
              assert.equal(blocked.status, 429);
              assert.equal((await blocked.json()).error, "rate_limited");
              const retryAfter = Number(blocked.headers.get("Retry-After"));
              assert.ok(Number.isInteger(retryAfter) && retryAfter >= 1 && retryAfter <= 600);
              assert.equal(db.database.prepare("SELECT COUNT(*) AS count FROM audit_log WHERE action = 'auth.login'").get().count, 0);

              nowMs += 601_000;
              const freshCode = await totpCode(secret, Math.floor(nowMs / 30_000));
              const recovered = await loginRequest(env, freshCode, "198.51.100.100");
              assert.equal(recovered.status, 200);
              assert.equal(db.database.prepare("SELECT COUNT(*) AS count FROM audit_log WHERE action = 'auth.login'").get().count, 1);
            } finally {
              Date.now = realNow;
              db.close();
            }
          });

          test("successful MFA clears the shared TOTP attempt budget for the current window", async () => {
            const db = new TestD1();
            const env = envFor(db);
            const realNow = Date.now;
            const nowMs = 1_810_000_000_000;
            Date.now = () => nowMs;
            try {
              const secret = await enroll(env);
              const step = Math.floor(nowMs / 30_000);
              const wrong = await wrongCodeFor(secret, step);
              for (let attempt = 0; attempt < 3; attempt += 1) {
                const response = await loginRequest(env, wrong, `203.0.113.${40 + attempt}`);
                assert.equal(response.status, 401);
              }
              const accountBucket = db.database.prepare("SELECT key, window_start FROM rate_limits WHERE count = 3").get();
              assert.ok(accountBucket?.key);

              const correct = await totpCode(secret, step);
              const success = await loginRequest(env, correct, "203.0.113.60");
              assert.equal(success.status, 200);
              assert.equal(db.database.prepare("SELECT COUNT(*) AS count FROM rate_limits WHERE key = ? AND window_start = ?").get(accountBucket.key, accountBucket.window_start).count, 0);
            } finally {
              Date.now = realNow;
              db.close();
            }
          });
          EOF

      - name: Run complete Admin suite
        working-directory: admin-control-plane/source
        run: |
          set -euo pipefail
          node --check worker-no-zero-trust.js
          node --test tests/*.test.mjs

      - name: Commit verified account TOTP budget
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hossam eldeen"
          git config user.email "52554618+Hosyss@users.noreply.github.com"
          git add admin-control-plane/source/worker-no-zero-trust.js admin-control-plane/source/tests/totp-account-budget.test.mjs
          git diff --cached --quiet && { echo "No account TOTP budget change to commit."; exit 1; }
          git commit -m "security: cap distributed TOTP attempts after password verification"
          git push origin HEAD:security/admin-control-plane-no-zero-trust-20260831
