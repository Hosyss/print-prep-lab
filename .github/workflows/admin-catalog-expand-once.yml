name: Admin catalog expand once

on:
  push:
    branches:
      - security/admin-control-plane-no-zero-trust-20260831
    paths:
      - .github/workflows/admin-catalog-expand-once.yml

permissions:
  contents: write

jobs:
  expand:
    if: github.ref == 'refs/heads/security/admin-control-plane-no-zero-trust-20260831'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact isolated branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enforce isolated preconditions
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/security/admin-control-plane-no-zero-trust-20260831'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('admin-control-plane/source/public/site-catalog.json').read_text(encoding='utf-8'))
          assert catalog.get('count') == 66
          assert len(catalog.get('pages', [])) == 66
          assert catalog.get('source') == 'route-stable v118.6 recovery baseline'
          PY

      - name: Generate 113-route catalog and update its unit test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import json
          import pathlib
          import re
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          base = 'https://printpreplab.pages.dev'
          catalog_path = pathlib.Path('admin-control-plane/source/public/site-catalog.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          existing = {page['route']: page for page in catalog['pages']}

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'PrintPrepLabAdminCatalogExpansion/1.0'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  if response.status != 200:
                      raise RuntimeError(f'{url} returned HTTP {response.status}')
                  return response.read()

          root = ET.fromstring(get(base + '/sitemap.xml'))
          sitemap_routes = set()
          for node in root.iter():
              if node.tag.endswith('loc') and node.text:
                  route = urllib.parse.urlparse(node.text.strip()).path or '/'
                  if route != '/' and route.endswith('/'):
                      route = route[:-1]
                  sitemap_routes.add(route)
          assert len(sitemap_routes) == 79, f'live sitemap changed unexpectedly: {len(sitemap_routes)} routes'

          def text_match(pattern, text):
              match = re.search(pattern, text, flags=re.I | re.S)
              if not match:
                  return ''
              value = re.sub(r'<[^>]+>', ' ', match.group(1))
              return html.unescape(re.sub(r'\s+', ' ', value)).strip()

          missing = []
          for route in sorted(sitemap_routes - set(existing)):
              decoded = get(base + route).decode('utf-8', errors='replace')
              title = text_match(r'<title[^>]*>(.*?)</title>', decoded)
              h1 = text_match(r'<h1[^>]*>(.*?)</h1>', decoded)
              description = ''
              match = re.search(r'<meta[^>]+name=["\']description["\'][^>]+content=["\'](.*?)["\']', decoded, flags=re.I | re.S)
              if not match:
                  match = re.search(r'<meta[^>]+content=["\'](.*?)["\'][^>]+name=["\']description["\']', decoded, flags=re.I | re.S)
              if match:
                  description = html.unescape(re.sub(r'\s+', ' ', match.group(1))).strip()
              assert title and h1 and description, f'baseline metadata missing for {route}'
              if route.startswith('/tools/'):
                  kind = 'tool'
              elif route.startswith('/guides/'):
                  kind = 'guide'
              elif route.startswith('/sizes/'):
                  kind = 'size'
              elif route in {'/', '/tools', '/guides', '/sizes'}:
                  kind = 'hub'
              elif route in {'/privacy', '/terms', '/contact'}:
                  kind = 'policy'
              else:
                  kind = 'trust'
              missing.append({
                  'route': route,
                  'file': '',
                  'title': title,
                  'kind': kind,
                  'sourceType': 'production-sitemap',
                  'sourceRelease': 'main',
                  'indexedInProduction': True,
                  'baselineH1': h1,
                  'baselineDescription': description,
              })

          assert len(missing) == 47, f'expected 47 sitemap routes missing from old Admin, found {len(missing)}'
          merged_pages = []
          for page in catalog['pages']:
              updated = dict(page)
              updated['sourceType'] = 'recovery-html'
              updated['sourceRelease'] = 'v118.6'
              updated['indexedInProduction'] = updated['route'] in sitemap_routes
              merged_pages.append(updated)
          merged_pages.extend(missing)

          routes = [page['route'] for page in merged_pages]
          assert len(merged_pages) == 113
          assert len(set(routes)) == 113
          assert sitemap_routes.issubset(set(routes))

          catalog['count'] = 113
          catalog['source'] = 'hybrid: pinned v118.6 recovery HTML + current Production sitemap'
          catalog['sourceProvenance'] = {
              'recoveryCommit': '07efaae843406f6cd9de74cb18ab5fffe2bf0a17',
              'recoveryArtifactSha256': 'd5b5ff59645402c06e86fe009d6474d8c2fcfc124ef3af29295f68428f9f6625',
              'productionOrigin': base,
              'productionSitemapRoutes': 79,
              'recoveryManagedRoutes': 66,
              'unionManagedRoutes': 113,
              'excludedSystemHtml': ['google6d67c58ff3b5201c.html'],
          }
          catalog['pages'] = merged_pages
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          test_path = pathlib.Path('admin-control-plane/source/tests/security.test.mjs')
          source = test_path.read_text(encoding='utf-8')
          pattern = re.compile(r'test\("catalog contains exactly 66 managed v118\.7 pages", \(\) => \{.*?\n\}\);', re.S)
          replacement = '''test("catalog covers the pinned recovery pages plus all live sitemap content", () => {
            const catalog = JSON.parse(fs.readFileSync(path.join(root, "public/site-catalog.json"), "utf8"));
            assert.equal(catalog.release, "v118.7");
            assert.equal(catalog.count, 113);
            assert.equal(catalog.pages.length, 113);
            assert.equal(new Set(catalog.pages.map((page) => page.route)).size, 113);
            const recoveryPages = catalog.pages.filter((page) => page.sourceType === "recovery-html");
            const sitemapPages = catalog.pages.filter((page) => page.sourceType === "production-sitemap");
            assert.equal(recoveryPages.length, 66);
            assert.equal(sitemapPages.length, 47);
            assert.ok(recoveryPages.every((page) => page.file.endsWith(".html")));
            assert.ok(sitemapPages.every((page) => page.file === "" && page.indexedInProduction === true));
            assert.ok(catalog.pages.some((page) => page.route === "/quote-compare"));
            assert.ok(catalog.pages.some((page) => page.route === "/tools/dpi-ppi-calculator"));
            assert.ok(catalog.pages.some((page) => page.route === "/guides/print-resolution-guide"));
            assert.ok(catalog.pages.some((page) => page.route === "/sizes/a4"));
            assert.ok(!catalog.pages.some((page) => String(page.file || "").startsWith("google")));
            assert.equal(catalog.sourceProvenance.productionSitemapRoutes, 79);
            assert.equal(catalog.sourceProvenance.recoveryManagedRoutes, 66);
            assert.equal(catalog.sourceProvenance.unionManagedRoutes, 113);
            assert.deepEqual(catalog.sourceProvenance.excludedSystemHtml, ["google6d67c58ff3b5201c.html"]);
          });'''
          updated, count = pattern.subn(replacement, source, count=1)
          assert count == 1, f'catalog unit-test replacement count was {count}'
          test_path.write_text(updated, encoding='utf-8')
          PY

      - name: Run full isolated Admin test suite before any push
        working-directory: admin-control-plane/source
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          node --check worker-no-zero-trust.js
          node --check public/admin.js
          node --check public/login.js
          npm test

      - name: Remove temporary write/discovery workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/admin-live-route-discovery.yml
          rm -f .github/workflows/admin-catalog-expand-once.yml

      - name: Verify remote head did not move and push one isolated commit
        shell: bash
        run: |
          set -euo pipefail
          branch='security/admin-control-plane-no-zero-trust-20260831'
          remote_head="$(git ls-remote origin "refs/heads/${branch}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA" || { echo '::error::Remote Admin branch moved during the guarded run. Refusing to push.'; exit 1; }
          git config user.name 'Print Prep Lab Admin CI'
          git config user.email 'actions@users.noreply.github.com'
          git add admin-control-plane/source/public/site-catalog.json admin-control-plane/source/tests/security.test.mjs .github/workflows/admin-live-route-discovery.yml .github/workflows/admin-catalog-expand-once.yml
          git diff --cached --check
          git commit -m 'admin: cover all 113 live and recovery routes'
          git push origin "HEAD:${branch}"

      - name: Record safety boundary
        run: |
          echo 'Catalog expanded on the isolated Admin branch only. No main write, Cloudflare mutation, D1 write, deployment, or Production write was performed.' >> "$GITHUB_STEP_SUMMARY"
