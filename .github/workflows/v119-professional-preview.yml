name: Print Prep Lab v119 professional preview

on:
  push:
    branches:
      - design/v119-professional-redesign-20260914
    paths:
      - 'release-artifacts/v119.0/**'
      - '.github/workflows/v119-professional-preview.yml'

permissions:
  contents: read

concurrency:
  group: print-prep-lab-v119-professional-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: printpreplab
      PREVIEW_BRANCH: v119-preview
      PREVIEW_ORIGIN: https://v119-preview.printpreplab.pages.dev

    steps:
      - name: Check out design branch
        uses: actions/checkout@v4

      - name: Verify preview boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/design/v119-professional-redesign-20260914'
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -f release-artifacts/v119.0/ppl-design-v119.css
          test -f release-artifacts/v119.0/ppl-home-v119.css
          test -f release-artifacts/v119.0/ppl-home-v119.html
          test -f release-artifacts/v119.0/build-v119.sh

      - name: Build v119 preview artifact
        shell: bash
        run: |
          set -euo pipefail
          bash release-artifacts/v119.0/build-v119.sh
          mkdir -p /tmp/ppl-v119
          unzip -q release-artifacts/v119.0/print-prep-lab-pages-v119-professional-preview.zip -d /tmp/ppl-v119
          test -s /tmp/ppl-v119/ppl-workflow-v119.css
          grep -Fq 'Print preparation, without the guesswork.' /tmp/ppl-v119/home-v112.html
          grep -Fq '.ppl-home-v119 #ppl-v118-launch' /tmp/ppl-v119/ppl-workflow-v119.css
          grep -Fq 'Run the job from one clear operations board.' /tmp/ppl-v119/operations.html
          grep -Fq 'google.com, pub-3369551572403499' /tmp/ppl-v119/ads.txt

      - name: Capture local visual QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v119-qa
          python3 -m http.server 4173 --directory /tmp/ppl-v119 >/tmp/v119-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            curl --silent --fail http://127.0.0.1:4173/home-v112.html >/dev/null && break
            sleep 0.5
          done
          curl --silent --fail http://127.0.0.1:4173/home-v112.html >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          src = Path('/tmp/ppl-v119/home-v112.html').read_text(encoding='utf-8')
          src = src.replace('<html lang="en" dir="ltr">', '<html lang="ar" dir="rtl">', 1)
          qa = """<script>window.addEventListener('load',()=>{document.documentElement.lang='ar';document.documentElement.dir='rtl';document.querySelectorAll('[data-ar]').forEach(el=>{const v=el.getAttribute('data-ar');if(!v)return;if(el.tagName==='INPUT')el.placeholder=v;else el.textContent=v;});});</script>"""
          src = src.replace('</body>', qa + '</body>')
          Path('/tmp/ppl-v119/home-v119-rtl-qa.html').write_text(src, encoding='utf-8')
          PY
          npx --yes playwright@1.63.0 screenshot --channel chrome --viewport-size "1920,1080" --wait-for-timeout 900 http://127.0.0.1:4173/home-v112.html /tmp/v119-qa/home-desktop.png
          npx --yes playwright@1.63.0 screenshot --channel chrome --viewport-size "390,844" --wait-for-timeout 900 http://127.0.0.1:4173/home-v112.html /tmp/v119-qa/home-mobile.png
          npx --yes playwright@1.63.0 screenshot --channel chrome --viewport-size "1440,1000" --wait-for-timeout 900 http://127.0.0.1:4173/home-v119-rtl-qa.html /tmp/v119-qa/home-rtl.png
          npx --yes playwright@1.63.0 screenshot --channel chrome --viewport-size "1920,1080" --wait-for-timeout 900 http://127.0.0.1:4173/operations.html /tmp/v119-qa/operations.png
          npx --yes playwright@1.63.0 screenshot --channel chrome --viewport-size "1920,1080" --wait-for-timeout 900 http://127.0.0.1:4173/print-readiness-v111.html /tmp/v119-qa/readiness.png
          npx --yes playwright@1.63.0 screenshot --channel chrome --viewport-size "1920,1080" --wait-for-timeout 900 http://127.0.0.1:4173/job-costing.html /tmp/v119-qa/costing.png
          npx --yes playwright@1.63.0 screenshot --channel chrome --viewport-size "1920,1080" --wait-for-timeout 900 http://127.0.0.1:4173/workspace.html /tmp/v119-qa/workspace.png

      - name: Upload local visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v119-local-visual-qa
          path: /tmp/v119-qa/
          if-no-files-found: warn
          retention-days: 7

      - name: Deploy preview only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 pages deploy /tmp/ppl-v119 \
            --project-name "$PAGES_PROJECT" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message 'v119 professional design preview'

      - name: Verify preview visual routes and boundaries
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            code="$(curl --silent --show-error --output /tmp/ops.html --write-out '%{http_code}' "$PREVIEW_ORIGIN/operations" || true)"
            [[ "$code" == '200' ]] && grep -Fq 'Run the job from one clear operations board.' /tmp/ops.html && break
            sleep 3
          done
          [[ "$code" == '200' ]]
          grep -Fq 'ppl-workflow-v119.css' /tmp/ops.html
          curl --silent --show-error --fail "$PREVIEW_ORIGIN/ppl-workflow-v119.css" | grep -Fq -- '--v119-sidebar:218px'
          curl --silent --show-error --fail "$PREVIEW_ORIGIN/tools/print-readiness-checker" >/tmp/readiness.html
          curl --silent --show-error --fail "$PREVIEW_ORIGIN/ads.txt" | grep -Fq 'pub-3369551572403499'
          curl --silent --show-error --dump-header /tmp/admin-headers.txt --output /dev/null "$PREVIEW_ORIGIN/admin"
          grep -Eqi '^HTTP/.* 302' /tmp/admin-headers.txt
          grep -Fqi 'location: https://print-prep-lab-admin.buildtools.workers.dev' /tmp/admin-headers.txt

          {
            echo '## Print Prep Lab v119 design preview'
            echo
            echo "- Preview: $PREVIEW_ORIGIN"
            echo "- Operations: $PREVIEW_ORIGIN/operations"
            echo "- Readiness tool: $PREVIEW_ORIGIN/tools/print-readiness-checker"
            echo '- Production changed: no'
            echo '- Admin origin changed: no'
            echo '- Secrets/D1 changed: no'
          } >> "$GITHUB_STEP_SUMMARY"
