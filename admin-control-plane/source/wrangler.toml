name = "print-prep-lab-admin"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "print-prep-lab-admin"
database_id = "REPLACE_AFTER_CREATING_D1"
migrations_dir = "migrations"

[vars]
PUBLIC_SITE_ORIGIN = "https://printpreplab.pages.dev"

# Set these through Cloudflare protected secrets/variables. Never commit values:
# CF_ACCESS_TEAM_DOMAIN = "your-team.cloudflareaccess.com"
# CF_ACCESS_AUD = "access-application-aud-tag"
# ADMIN_EMAILS = "owner@example.com"
# ADMIN_ORIGIN = "https://admin.example.com"
# CSRF_SECRET = "at-least-32-random-bytes"
# AUDIT_SECRET = "different-at-least-32-random-bytes"
